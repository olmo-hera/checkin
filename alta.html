<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-w2dJA2QaYgCziZNHooW/Ik27qd3c8tNJdDlRP/xv7Gs=' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https://static.wixstatic.com data:; connect-src https://www.herazenter.com 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#EFE7DE">
<link rel="icon" type="image/png" sizes="32x32" href="https://static.wixstatic.com/media/9d6afa_e930e021d3564d24bc04bdc3e4c172f3~mv2.png/v1/fill/w_32,h_32/favicon.png">
<title>Alta en mostrador · Hera Zenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,400&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --terracota:#9A4215; --carbon:#424949; --texto:#2B2B2B; --gris:#5E5E5E;   /* v5: gris más oscuro (contraste AA sobre arena) */
  --arena:#EFE7DE; --arena-suave:#F7F2EC; --crema:#E8DCD0; --pizarra:#788991;
  --ok:#4F7A5A; --alerta:#B5651D;
  --fuego:#E8613C; --agua:#3C8FD6; --aire:#6F9CCB; --tierra-el:#7A6A4F;
  --terracota-suave:#FBF0E8; --verde-suave:#E9F2EB; --verde-texto:#2E5A3A; --oro:#D4A23C; --oro-borde:#A97A1F; --oro-tallo:#B8862B;
  /* v6: paleta del «Weekly Schedule» de Hera (Instagram): agenda de la semana, un color por disciplina */
  --ag-vino:#8E4A55; --ag-naranja:#D98A5B; --ag-salvia:#8E9E7A; --ag-azul:#7590A3; --ag-carbon:#3E3E3E; --ag-crema:#F3EEE6; --ag-borde:#DDD2C4;
  --radio:18px; --sombra:0 1px 2px rgba(66,73,73,.08),0 6px 24px rgba(66,73,73,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--arena);color:var(--texto);font-family:Jost,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3,.num{font-family:Poppins,Helvetica,Arial,sans-serif;font-weight:600;color:var(--carbon);letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;font-size:22px;-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:16px;padding:18px 24px 6px;width:100%;max-width:1080px;margin:0 auto}
.top img{height:54px}
.top .titulo{font-family:Poppins;font-weight:600;font-size:18px;color:var(--carbon)}
.top .titulo small{display:block;font-family:Jost;font-weight:400;font-size:15px;color:var(--gris)}
.cancelar{margin-left:auto;border:1.5px solid var(--crema);background:#fff;border-radius:999px;padding:12px 22px;font-size:18px;color:var(--carbon)}
.cancelar:active{background:var(--arena-suave)}

main{flex:1;padding:12px 24px 28px;display:flex;flex-direction:column;width:100%;max-width:880px;margin:0 auto}
.vista{display:none;flex-direction:column;align-items:center;gap:20px;animation:entra .2s ease-out;width:100%;text-align:center}
.vista.activa{display:flex}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vista h1{font-size:34px;line-height:1.15;margin-top:2vh}
.vista > p, .sub{font-size:19px;color:var(--gris);max-width:640px}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;width:100%}
.op{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:24px 22px;min-height:96px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;font-size:23px;font-weight:500;color:var(--carbon);border:2px solid transparent}
.op small{font-size:16px;font-weight:400;color:var(--gris)}
.op:active{transform:scale(.98);background:var(--arena-suave)}
.op .el{width:56px;height:56px}
.campo{width:min(560px,100%);border:1.5px solid var(--crema);background:#fff;border-radius:15px;padding:18px 20px;outline:0;text-align:center}
.campo:focus{border-color:var(--pizarra)}
.error{color:var(--alerta);font-size:18px;min-height:24px;max-width:640px}
.btn{border-radius:15px;padding:20px 28px;font-size:21px;font-weight:500;text-align:center;min-height:64px;min-width:260px}
.btn.pri{background:var(--terracota);color:#fff}
.btn.sec{background:#fff;color:var(--terracota);border:1.5px solid var(--terracota)}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.55}
.atras{align-self:flex-start;font-size:18px;color:var(--gris);padding:8px 4px}
.tarjeta{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:20px 24px;width:min(640px,100%);text-align:left}
.tarjeta .fila{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--arena);font-size:19px}
.tarjeta .fila:first-child{border-top:0}
.tarjeta .fila span:first-child{color:var(--gris)}
.tarjeta .fila b{font-weight:500;text-align:right}
.precio{font-family:Poppins;font-weight:600;font-size:40px;color:var(--carbon)}
.nota{font-size:16px;color:var(--gris);max-width:600px}
.quien{background:var(--arena-suave);border:1px solid var(--crema);border-radius:14px;padding:12px 18px;font-size:18px;color:var(--carbon);max-width:600px}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(360px,100%)}
.teclado button{background:#fff;border-radius:16px;font-family:Poppins;font-weight:600;font-size:28px;color:var(--carbon);min-height:68px;box-shadow:var(--sombra)}
.teclado button:active{background:var(--crema)}
.puntos{display:flex;gap:14px;justify-content:center}
.puntos i{width:18px;height:18px;border-radius:50%;border:2px solid var(--carbon)}
.puntos i.lleno{background:var(--carbon)}
.qr-grande{width:280px;height:280px;background:#fff;border-radius:28px;padding:14px;box-shadow:0 6px 24px rgba(154,66,21,.18);display:grid;place-items:center}
.qr-grande svg{width:100%;height:100%;display:block}
.pasos{text-align:left;font-size:19px;color:var(--carbon);line-height:1.55;padding-left:26px;max-width:560px}
.pasos b{color:var(--terracota)}
.ok-msg{color:var(--ok);font-size:18px;min-height:24px}
.pregunta{font-size:24px;margin-top:6px}
.fila-btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.cargando{color:var(--gris);font-size:18px}
.giro{width:46px;height:46px;border-radius:50%;border:4px solid var(--crema);border-top-color:var(--terracota);animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.cuenta-atras{font-size:17px;color:var(--gris)}
.cuenta-atras b{color:var(--carbon);font-family:Poppins}
.bloqueo{background:#9A3B2E;color:#fff;border-radius:var(--radio);padding:28px 24px;max-width:640px}
.bloqueo h1{color:#fff}
.bloqueo p{color:#fff;font-size:19px;margin-top:10px}
.correo-grande{font-family:Poppins;font-weight:600;font-size:24px;color:var(--carbon);word-break:break-all}
.demo{position:fixed;right:12px;bottom:12px;font-size:12px;color:var(--gris);background:var(--arena-suave);border:1px dashed var(--crema);padding:6px 10px;border-radius:8px}
@media (max-width:700px){ .top{padding:12px 16px 4px} main{padding:8px 16px 20px} .vista h1{font-size:27px} .btn{min-width:0;width:100%} }
/* v2: pantallas explicativas (letra grande, frases cortas) */
.planes2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;width:100%;text-align:left}
.carta{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:24px 24px 20px;display:flex;flex-direction:column;gap:12px;border:2px solid transparent}
.carta h2{font-size:28px;display:flex;align-items:center;gap:12px}
.carta .lema{font-size:20px;color:var(--terracota);font-weight:500}
.carta ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:19px;line-height:1.35;color:var(--texto)}
.carta ul li{padding-left:26px;position:relative}
.carta ul li::before{content:'✓';position:absolute;left:0;color:var(--ok);font-weight:600}
.carta .grupo{font-size:16px;color:var(--gris);margin-top:4px}
.carta .chica{font-size:15px;color:var(--gris);border-top:1px solid var(--arena);padding-top:10px;line-height:1.4}
.carta .btn{margin-top:auto;width:100%}
.carta.elegible{cursor:pointer}
.carta.elegible:active{transform:scale(.99);background:var(--arena-suave)}
.carta .horas{font-size:16px;color:var(--carbon);line-height:1.5}
.carta .horas b{font-weight:500}
.op .mejor,.mejor{display:inline-block;background:#F5E7C8;color:#7A5410;border-radius:999px;padding:3px 10px;font-size:14px;font-weight:500;margin-top:4px}
.op.destacada{border-color:#E2C27A}
.op .ppc{font-size:18px;color:var(--carbon);font-weight:500}
.op small.falta{color:var(--alerta);font-size:15px}
.empuje{background:#FFF7E8;border:2px solid #E2C27A;border-radius:var(--radio);padding:24px;max-width:640px;text-align:left;display:flex;flex-direction:column;gap:12px}
.empuje p{font-size:21px;line-height:1.4;color:var(--texto)}
.empuje .chica{font-size:15px;color:var(--gris)}
.refuerzo{background:#EEF5EF;border:1.5px solid #B9D3BF;border-radius:14px;padding:14px 18px;font-size:18px;line-height:1.4;max-width:640px;text-align:left;color:var(--texto)}
.letra{width:min(640px,100%);text-align:left;font-size:15px;color:var(--gris);line-height:1.45}
.letra b{color:var(--carbon);font-weight:500}
.letra ul{padding-left:20px;margin-top:4px}
.correo-app{background:#fff;border:2px solid var(--terracota);border-radius:16px;padding:14px 18px;max-width:640px;width:100%}
.correo-app small{display:block;font-size:16px;color:var(--gris)}
.correo-app .aviso{font-size:17px;color:var(--terracota);font-weight:500;margin-top:6px}
.app-fila{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.pin-puntos{display:flex;gap:14px;justify-content:center;min-height:22px}
.pin-puntos i{width:18px;height:18px;border-radius:50%;background:var(--carbon)}
.volver-k{font-size:17px;color:var(--gris);text-decoration:underline;padding:10px}
/* v3: correo en grande, sugerencia y registro */
.correo-grande.grande{font-size:30px}
.sugerencia{background:#FFF7E8;border:2px solid #E2C27A;border-radius:16px;padding:16px 20px;max-width:640px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.sugerencia p{font-size:21px;color:var(--texto)}
.form{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.etiqueta{font-size:18px;color:var(--carbon);margin-top:6px}
.cumple{display:grid;grid-template-columns:1fr 1.6fr 1.3fr;gap:10px;width:min(560px,100%)}
.cumple .campo{width:100%;padding:16px 10px;font-size:20px;-webkit-appearance:none;appearance:none}
.dato{display:flex;flex-direction:column;gap:4px;width:min(560px,100%);text-align:left}
.dato > span{font-size:15px;color:var(--gris);padding-left:6px}
.dato .campo{width:100%}
.dato small{font-size:16px;color:var(--carbon);padding-left:6px;min-height:20px}
.res-correo{display:flex;flex-direction:column;gap:6px;align-items:center}
.res-correo .btn{min-height:48px;padding:10px 22px;font-size:18px;min-width:0}
/* v4: planes de largo plazo y plan de prueba */
.extra{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}
.largo-el{display:flex;align-items:center;gap:10px;font-size:24px;align-self:flex-start;margin-top:8px}
.carta p{font-size:18px;line-height:1.4;color:var(--texto)}
.carta.prueba{border:2px dashed var(--alerta);background:#FFF7E8;width:min(640px,100%)}
.carta.prueba .grupo{color:var(--alerta);font-weight:500;font-size:18px}
.aviso-cancelar{background:#FDECEC;border:2.5px solid #B42318;border-radius:14px;padding:12px 18px;font-size:19px;font-weight:600;color:#B42318;max-width:640px;margin:0 auto 10px}
.aviso-prueba{background:#FFF7E8;border:2px dashed var(--alerta);border-radius:14px;padding:12px 18px;font-size:18px;color:var(--alerta);max-width:640px}
/* v5 (rediseño 8-nov): fichas de membresía/paquete, elementos, «¿cuántas clases?» y trimestrales. Una cosa grande por ficha
   (el precio por clase o el número de clases), frases cortas con icono, letra chica tras «ⓘ Condiciones». */
.ico{width:26px;height:26px;flex:none;color:var(--terracota)}
.heroe{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;color:var(--carbon)}
.heroe .desde{font-size:19px}
.heroe .monto{font-family:Poppins;font-weight:600;font-size:54px;line-height:1;color:var(--terracota);letter-spacing:-.02em}
.heroe .unidad{font-size:21px;font-weight:500}
.heroe-nota{font-size:16px;color:var(--gris);margin-top:-6px}
.puntos2{list-style:none;display:flex;flex-direction:column;gap:12px}
.carta .puntos2 li{display:flex;align-items:center;gap:12px;font-size:20px;line-height:1.3;color:var(--texto);padding-left:0}
.carta .puntos2 li::before{content:none}
.cab .ico{width:50px;height:50px;color:var(--carbon)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;background:var(--arena-suave);border:1px solid var(--crema);border-radius:999px;padding:7px 14px;font-size:16px;line-height:1.25;color:var(--carbon)}
.chip .fam{color:var(--gris);font-size:14px}
.ahorro{display:flex;flex-direction:column;gap:2px;background:var(--verde-suave);border-radius:14px;padding:10px 14px;color:var(--verde-texto);font-size:19px}
.ahorro b{font-family:Poppins;font-weight:600}
.ahorro small{font-size:15px;color:var(--verde-texto)}
.cond{align-self:flex-start;font-size:17px;color:var(--carbon);text-decoration:underline;text-underline-offset:3px;padding:10px 2px;min-height:44px}
.plan{position:relative;padding:28px 24px 22px;gap:16px}
.plan .cab{display:flex;align-items:center;gap:14px}
.plan .cab h2{font-size:30px}
.plan .cab .lema{font-size:17px;color:var(--carbon);font-weight:400;margin-top:2px}
.plan .cab svg{flex:none}
.plan.reco{border:2.5px solid var(--terracota);background:linear-gradient(180deg,var(--terracota-suave) 0,#fff 46%)}
.sello{position:absolute;top:-1px;right:20px;background:var(--terracota);color:#fff;font-family:Poppins;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:0 0 12px 12px}
.plan .btn{margin-top:auto}
.franja{width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:linear-gradient(90deg,#F6E6D2,#FFF8EE);border:2px solid #E2C27A;border-radius:var(--radio);padding:18px 20px;box-shadow:var(--sombra)}
.franja:active{transform:scale(.99)}
.franja .estrella{width:48px;height:48px;border-radius:50%;background:var(--terracota);color:#fff;display:grid;place-items:center;flex:none;font-size:24px}
.franja .txt{flex:1;display:flex;flex-direction:column;gap:3px}
.franja .tit{font-family:Poppins;font-weight:600;font-size:21px;color:var(--carbon);line-height:1.2}
.franja .lin{font-size:19px;color:var(--texto)}
.franja .lin b{color:var(--terracota);font-family:Poppins;font-weight:600}
.franja .sub2{font-size:15px;color:var(--gris)}
.franja .flecha{font-size:34px;color:var(--terracota);flex:none;line-height:1}
/* elementos */
.el-carta{padding:0;overflow:hidden;gap:0}
.el-cab{position:relative;display:flex;align-items:center;gap:14px;padding:18px 20px;border-top:6px solid var(--c)}
.el-cab::before{content:'';position:absolute;inset:0;background:var(--c);opacity:.13}
.el-cab > *{position:relative}
.el-cab h2{font-size:28px;flex:1}
.el-precio{text-align:right;color:var(--carbon);line-height:1.1}
.el-precio small{display:block;font-size:15px}
.el-precio b{font-family:Poppins;font-weight:600;font-size:30px;color:var(--carbon)}
.el-precio span{font-size:16px}
.el-cuerpo{display:flex;flex-direction:column;gap:14px;padding:16px 20px 18px;flex:1}
.el-cuerpo .chip{font-size:17px;background:#fff;border-color:var(--crema)}
.agenda{display:flex;flex-direction:column;gap:10px}
.agenda .tit{font-size:16px;color:var(--gris)}
.ag-fila{display:flex;flex-direction:column;gap:6px}
.ag-fila b{font-size:17px;font-weight:500;color:var(--carbon)}
.ag-horas{display:flex;flex-wrap:wrap;gap:6px}
.ag-horas i{font-style:normal;font-size:16px;color:var(--carbon);background:var(--arena-suave);border-radius:8px;padding:5px 10px;font-variant-numeric:tabular-nums}
.el-pie{margin-top:auto;padding-top:6px;font-size:19px;font-weight:500;color:var(--terracota)}
/* ¿cuántas clases? */
.tiles{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.op.tile{position:relative;justify-content:flex-start;gap:4px;padding:30px 18px 22px;min-height:0}
.tile-num{font-family:Poppins;font-weight:600;font-size:60px;line-height:1;color:var(--carbon)}
.tile-num.txt{font-size:34px;line-height:1.2}
.tile-unidad{font-size:19px;color:var(--carbon);font-weight:400}
.tile-sep{width:44px;height:2px;background:var(--crema);margin:10px 0 8px}
.tile-ppc{font-size:20px;color:var(--carbon);font-weight:400}
.tile-ppc b{font-family:Poppins;font-weight:600;font-size:26px;color:var(--terracota)}
.op.tile small{font-size:17px;color:var(--gris)}
.op.tile.destacada{border-color:#D9B25E;background:#FFFBF2;padding-top:40px}
.op.tile.sello2{padding-top:58px}
.op.tile .mejor small{display:block;font-size:13px;line-height:1.2;opacity:.9}
.op.tile .mejor{position:absolute;top:-1px;left:50%;transform:translateX(-50%);margin:0;border-radius:0 0 10px 10px;width:max-content;max-width:calc(100% - 24px);font-size:14px;padding:4px 12px;background:#F5E7C8;color:#6A4708}
/* trimestrales y semestrales */
.lg-fam{display:inline-block;align-self:flex-start;background:var(--terracota-suave);color:var(--terracota);font-weight:500;font-size:15px;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:4px 12px}
.carta .lg-nombre{font-size:20px;line-height:1.25}
.lg-linea{font-size:19px;color:var(--texto);margin-top:-6px}
.lg-vs{font-size:17px;line-height:1.4;border-radius:12px;padding:10px 14px;background:var(--verde-suave);color:var(--verde-texto)}
.lg-vs.no{background:var(--arena-suave);color:var(--texto)}
/* panel de condiciones */
.hoja-fondo{position:fixed;inset:0;z-index:50;background:rgba(43,43,43,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.hoja{background:#fff;border-radius:22px;width:min(620px,100%);max-height:86dvh;overflow:auto;padding:26px 24px;text-align:left;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 48px rgba(0,0,0,.25)}
.hoja h2{font-size:26px}
.hoja h3{font-size:18px;margin-top:6px}
.hoja p,.hoja li{font-size:18px;line-height:1.45;color:var(--texto)}
.hoja ul{padding-left:22px;display:flex;flex-direction:column;gap:4px}
.hoja .btn{width:100%;margin-top:6px}
@media (max-width:700px){ .heroe .monto{font-size:46px} .plan .cab h2{font-size:26px} .franja{padding:16px} .franja .estrella{width:40px;height:40px;font-size:20px} .franja .tit{font-size:19px} .tile-num{font-size:52px} }

.op.tile .tile-regalo span{font-size:14px;font-weight:400;color:var(--verde-texto)}
.regalo-caja{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;margin-top:-6px}
.regalo-sw{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid #B9D3BF;border-radius:999px;padding:8px 10px 8px 20px;min-height:52px;font-size:18px;font-weight:500;color:var(--verde-texto)}
.regalo-sw .sw{position:relative;width:52px;height:30px;border-radius:999px;background:#C9CFC9;flex:none;transition:background .2s}
.regalo-sw .sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.regalo-sw[aria-checked="true"]{background:var(--verde-suave);border-color:var(--ok)}
.regalo-sw[aria-checked="true"] .sw{background:var(--ok)}
.regalo-sw[aria-checked="true"] .sw i{transform:translateX(22px)}
.regalo-nota{font-size:16px;line-height:1.4;color:var(--verde-texto);max-width:620px}
.cond-in{font-size:16px;color:var(--verde-texto);text-decoration:underline;text-underline-offset:3px;padding:4px 2px}
.emp-regalo{font-size:18px;line-height:1.35;text-align:center;color:var(--verde-texto)}
.hoja table{width:100%;border-collapse:collapse;font-size:18px}
.hoja th,.hoja td{text-align:left;padding:8px 6px;border-top:1px solid var(--arena)}
.hoja th{font-size:16px;font-weight:500;color:var(--gris);border-top:0}
.hoja td b{font-family:Poppins;font-weight:600;color:var(--verde-texto)}
.hoja .ej{background:var(--arena-suave);border-radius:12px;padding:10px 14px}
.bien-caja{background:var(--verde-suave);border:1.5px solid #B9D3BF;border-radius:14px;padding:12px 18px;font-size:19px;line-height:1.4;max-width:640px;width:100%;text-align:left;color:var(--verde-texto)}
.bien-caja small{display:block;font-size:16px;color:var(--texto);margin-top:4px}
.bien-recep{font-size:16px;color:var(--gris);text-decoration:underline;text-underline-offset:3px;padding:10px 6px;min-height:44px}
.bien-ok{font-size:16px;color:var(--verde-texto)}
.res-aviso{background:#FFF7E8;border:2px solid #E2C27A;border-radius:14px;padding:14px 18px;font-size:19px;line-height:1.4;max-width:640px;width:100%;text-align:left;color:var(--texto)}
.casilla{display:flex;align-items:center;gap:12px;font-size:19px;color:var(--carbon);background:#fff;border:1.5px solid var(--crema);border-radius:14px;padding:12px 16px;max-width:640px;width:100%;text-align:left;min-height:56px}
.casilla input{width:26px;height:26px;flex:none;accent-color:var(--terracota)}
/* v9 (Olmo, 9-nov): cinta «★ El más elegido» en la ficha de 12 clases (la única cinta); «el más barato por clase», etiqueta
   dentro de su ficha. */
.op.tile.elegida{border-color:var(--terracota);background:linear-gradient(180deg,var(--terracota-suave) 0,#fff 55%);padding-top:52px}
.op.tile .cinta{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:var(--terracota);color:#fff;font-family:Poppins;font-weight:600;font-size:16px;letter-spacing:.02em;padding:6px 16px;border-radius:0 0 12px 12px;white-space:nowrap}
.mejor-et{display:inline-block;margin-top:8px;background:#F5E7C8;color:#6A4708;border-radius:10px;padding:4px 10px;font-size:15px;font-weight:500;line-height:1.25}
.mejor-et small{display:block;font-size:13px;font-weight:400;color:#6A4708}
/* v9: bloque «Beneficios de membresía» dentro de la ficha (antes un enlace «+N beneficios más»). */
.ben{background:linear-gradient(135deg,#FFF6E3,#FFFDF8);border:1.5px solid #E2C27A;border-radius:16px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px}
.ben-tit{display:flex;align-items:center;gap:8px;font-family:Poppins;font-weight:600;font-size:17px;color:#7A5410;letter-spacing:.01em}
.ben ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.carta .ben li{display:flex;align-items:center;gap:10px;font-size:17px;line-height:1.3;color:var(--texto);padding-left:0}
.carta .ben li::before{content:none}
.ben li > .ico{flex:none;width:34px;height:34px;padding:6px;border-radius:50%;background:#fff;border:1px solid #EBD3A0;color:var(--terracota)}
.ben li span{display:flex;flex-direction:column}
.ben .ben-ahorro b{font-family:Poppins;font-weight:600;font-size:18px;color:var(--verde-texto)}
.ben .ben-ahorro b b{color:var(--verde-texto)}
.ben .ben-ahorro > .ico{background:var(--verde-suave);border-color:#B9D3BF;color:var(--verde-texto)}
.ben small{font-size:15px;color:var(--gris);line-height:1.3}
.ben small b{font-family:Poppins;font-weight:600;color:var(--verde-texto)}
.plan .cond{text-align:left}
.tiles:has(.elegida) .op.tile{padding-top:52px}
/* v9: carrusel (trimestral · semestral · anual, y la hoja de Dúo/Tribu): se desliza con el dedo, flechas y puntos. */
.carr{width:100%;display:flex;flex-direction:column;gap:10px}
.carr-pista{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding:4px 2px 8px;outline:0}
.carr-pista::-webkit-scrollbar{display:none}
.carr-pista:focus-visible{box-shadow:0 0 0 3px var(--pizarra);border-radius:12px}
.carr-item{flex:0 0 calc((100% - 16px) / 2.3);scroll-snap-align:start;display:flex;text-align:left}
.carr-hoja .carr-item{flex-basis:100%}
.carr-hoja .carr-pista{gap:24px;align-items:flex-start;overflow-y:hidden}
.gr-dia{display:flex;flex-direction:column;gap:12px}
.hoja .gr-tit{font-size:22px;margin:0;color:var(--terracota)}
.gr-intro{font-size:18px}
.gr-pcts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gr-pct{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--terracota-suave);border:1.5px solid #E8C9B4;border-radius:16px;padding:14px 8px;text-align:center}
.gr-pct b{font-family:Poppins;font-weight:600;font-size:40px;line-height:1.05;color:var(--terracota)}
.gr-pct span{font-size:18px;font-weight:500;color:var(--carbon)}
.gr-pct small{font-size:15px;color:var(--gris)}
.gr-plan{font-family:Poppins;font-weight:600;font-size:20px;color:var(--carbon)}
.gr-filas{display:flex;flex-direction:column;background:var(--arena-suave);border-radius:14px;padding:4px 14px}
.gr-fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--crema)}
.gr-fila:first-child{border-top:0}
.gr-q{font-size:18px;color:var(--carbon)}
.gr-q i{font-style:normal;font-weight:600;color:var(--terracota);margin-left:4px}
.gr-p{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.gr-p b{font-family:Poppins;font-weight:600;font-size:24px;color:var(--carbon)}
.gr-p small{font-size:14px;color:var(--verde-texto)}
.gr-claves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gr-clave{display:flex;gap:10px;align-items:flex-start;background:var(--arena-suave);border-radius:14px;padding:10px 12px}
.gr-ico{flex:none;width:38px;height:38px;border-radius:50%;background:#fff;border:1.5px solid #E8C9B4;display:grid;place-items:center;font-family:Poppins;font-weight:600;font-size:16px;color:var(--terracota)}
.gr-clave span:last-child{display:flex;flex-direction:column;gap:2px}
.gr-clave b{font-size:17px;font-weight:600;color:var(--carbon);line-height:1.25}
.gr-clave small{font-size:15px;line-height:1.35;color:var(--texto)}
.hoja .gr-chica{font-size:15px;color:var(--gris)}
.gr-pasos{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:none}
.hoja .gr-pasos li{display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.4}
.gr-n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--terracota);color:#fff;display:grid;place-items:center;font-family:Poppins;font-weight:600;font-size:18px}
@media (max-width:520px){ .gr-claves{grid-template-columns:1fr} .gr-pct b{font-size:34px} }
.hoja .perks{padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.hoja .perks li{display:flex;align-items:flex-start;gap:10px}
.hoja .perks .ico{width:20px;height:20px;margin-top:3px}
.carr-item > *{flex:1;min-width:0}
.carr-ctl{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.carr.cabe .carr-ctl{display:none}
.carr.fin .carr-pista-txt{visibility:hidden}
.carr-fl{width:44px;height:44px;border-radius:50%;background:#fff;border:1.5px solid var(--crema);font-size:26px;line-height:1;color:var(--carbon)}
.carr-fl[disabled]{opacity:.35}
.carr-puntos{display:flex;gap:4px}
.carr-p{width:28px;height:28px;display:grid;place-items:center}
.carr-p::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--crema);transition:background .2s,transform .2s}
.carr-p[aria-current="true"]::after{background:var(--terracota);transform:scale(1.25)}
.carr-pista-txt{flex-basis:100%;text-align:center;font-size:16px;color:var(--terracota);font-weight:500}
@media (prefers-reduced-motion:reduce){ .carr-pista{scroll-behavior:auto} }
@media (max-width:700px){ .carr-item{flex-basis:86%} }
/* v9: tarjeta anual (del PDF; se contrata en recepción) */
.lg-anual{border:2px dashed var(--oro-borde);background:linear-gradient(180deg,#FFF8EA 0,#fff 50%)}
.lg-fam-fila{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lg-anual .lg-fam{background:#F5E7C8;color:#6A4708}
.an-recep{font-size:15px;font-weight:500;color:#6A4708;border:1px solid #E2C27A;border-radius:999px;padding:3px 10px}
.lg-anual .el-pie{color:#7A5410}
.hoja .an-aviso{background:#FFF7E8;border:1.5px solid #E2C27A;border-radius:12px;padding:10px 14px}
.hoja .an-aviso + p,.hoja .an-msi,.hoja .an-msi + .nota{margin-top:10px}
/* v9: celda anual del bloque «Si pagas por adelantado» */
.adel-celdas.con-anual{grid-template-columns:repeat(3,minmax(0,1fr))}
.adel-celdas .adel-anual{background:#FFF8EA;border:1.5px dashed var(--oro-borde)}
.adel-anual .adel-dur{color:#6A4708;font-weight:500}
.adel-anual-linea{display:block;font-size:17px;line-height:1.35;color:#5C4210;background:#FFF8EA;border:1.5px dashed var(--oro-borde);border-radius:12px;padding:10px 14px}
/* Revisión v9: en celular las 3 celdas van una debajo de otra (deslizar dentro de un botón que abre otra pantalla no se descubre). */
@media (max-width:520px){ .adel-celdas.con-anual{grid-template-columns:1fr} }
@media (max-height:820px) and (min-width:701px){ .ben{padding:10px 12px 8px;gap:6px} .ben ul{gap:5px} .ben li > .ico{width:30px;height:30px;padding:5px} }
</style>
</head>
<body>

<header class="top">
  <img src="https://static.wixstatic.com/media/9d6afa_e930e021d3564d24bc04bdc3e4c172f3~mv2.png/v1/fill/w_140,h_140/icono.png" alt="Hera Zenter">
  <div class="titulo">Alta en mostrador<small id="paso"></small></div>
  <button class="cancelar" id="cancelar" hidden>Cancelar</button>
</header>

<main>
  <!-- CONTRASEÑA DE LA TABLET (la misma del kiosco: comparte su token) -->
  <section class="vista" id="vClave">
    <h1>Alta en mostrador</h1>
    <p>Esta pantalla es solo para la tablet de recepción.</p>
    <input class="campo" id="clave" type="password" placeholder="Contraseña" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="error" id="claveError"></div>
    <button class="btn pri" id="claveOk">Entrar</button>
  </section>

  <section class="vista" id="vCargando"><div class="giro"></div><p class="cargando" id="cargandoTxt">Cargando…</p></section>

  <!-- 0. PIN DE LA RECEPCIONISTA (la venta queda a su nombre; el PIN nunca se guarda) -->
  <section class="vista" id="vPin">
    <h1 id="pinTitulo"></h1>
    <p id="pinTexto"></p>
    <div class="pin-puntos" id="pinPuntos"></div>
    <div class="teclado" id="pinTeclado"></div>
    <div class="error" id="pinError"></div>
    <p class="nota" id="pinNota"></p>
    <button class="volver-k" id="pinVolver"></button>
  </section>

  <!-- 2. CORREO (después de elegir el plan) -->
  <section class="vista" id="vCorreo">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 data-tx="correo.titulo"></h1>
    <p data-tx="correo.texto"></p>
    <input class="campo" id="correo" type="email" inputmode="email" data-ph="correo.placeholder" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
    <div class="error" id="correoError"></div>
    <button class="btn pri" id="correoOk" data-tx="correo.seguir"></button>
  </section>

  <!-- 2b. ¿ESTÁ BIEN ESCRITO? (en grande, con sugerencia si parece error de dedo) -->
  <section class="vista" id="vConfirma">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 data-tx="confirma.pregunta"></h1>
    <div class="correo-app"><div class="correo-grande grande" id="confCorreo"></div><div class="aviso" data-tx="confirma.app"></div></div>
    <div class="sugerencia" id="confSug" hidden><p id="confSugTxt"></p><button class="btn pri" id="confUsar"></button></div>
    <div class="error" id="confError"></div>
    <div class="fila-btns">
      <button class="btn pri" id="confSi" data-tx="confirma.si"></button>
      <button class="btn sec" id="confCorregir" data-tx="confirma.corregir"></button>
    </div>
  </section>

  <!-- 2c. YA TIENE CUENTA: los 4 últimos de su celular -->
  <section class="vista" id="vCel">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 data-tx="cel.titulo"></h1>
    <p id="celTexto" data-tx="cel.texto"></p>
    <div class="puntos" id="puntos"><i></i><i></i><i></i><i></i></div>
    <div class="teclado" id="teclado"></div>
    <div class="error" id="celError"></div>
    <p class="nota" id="celNota" data-tx="cel.nota"></p>
    <p class="nota" id="celRecepcion" data-tx="cel.recepcion" hidden></p>
    <button class="btn sec" id="celOtroCorreo" data-tx="cel.otroCorreo"></button>
  </section>

  <!-- 2d. YA TIENE CUENTA: hola, sus planes y (si falta) su colonia -->
  <section class="vista" id="vHola">
    <h1 id="holaTitulo"></h1>
    <div class="quien" id="quien"></div>
    <div id="holaColoniaCaja" hidden style="display:flex;flex-direction:column;gap:10px;align-items:center;width:100%">
      <label for="holaColonia" style="font-size:20px;color:var(--carbon)" data-tx="hola.colonia"></label>
      <input class="campo" id="holaColonia" autocomplete="off" autocapitalize="words" spellcheck="false" data-ph="registro.colonia" maxlength="60">
    </div>
    <div class="error" id="holaError"></div>
    <div class="fila-btns">
      <button class="btn pri" id="holaOk"></button>
      <button class="btn sec" id="holaSaltar" hidden data-tx="hola.saltar"></button>
    </div>
  </section>

  <!-- 2e. NUEVA: registro desde cero -->
  <section class="vista" id="vRegistro">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 data-tx="registro.titulo"></h1>
    <p data-tx="registro.sub"></p>
    <div class="correo-app"><small data-tx="registro.correo"></small><div class="correo-grande" id="regCorreo"></div></div>
    <div class="form">
      <!-- Etiquetas visibles (revisión v3): al escribir, el texto guía desaparece y en tablet no se sabía qué campo era. -->
      <label class="dato"><span data-tx="registro.nombre"></span><input class="campo" id="regNombre" data-ph="registro.nombre" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="60"></label>
      <label class="dato"><span data-tx="registro.apellido"></span><input class="campo" id="regApellido" data-ph="registro.apellido" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="60"></label>
      <!-- Sin recortar: «+52 33 1234 5678» (16 caracteres, así lo pega iOS) se normaliza, nunca se trunca. -->
      <label class="dato"><span data-tx="registro.celular"></span><input class="campo" id="regCelular" type="tel" inputmode="numeric" data-ph="registro.celularEjemplo" autocomplete="off" maxlength="24"><small id="regCelVes"></small></label>
      <label class="dato"><span data-tx="registro.colonia"></span><input class="campo" id="regColonia" data-ph="registro.coloniaEjemplo" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="60"></label>
      <label class="etiqueta" data-tx="registro.cumple"></label>
      <div class="cumple">
        <select class="campo" id="regDia" aria-label="Día"></select>
        <select class="campo" id="regMes" aria-label="Mes"></select>
        <input class="campo" id="regAnio" type="tel" inputmode="numeric" data-ph="registro.anio" autocomplete="off" maxlength="4">
      </div>
    </div>
    <div class="error" id="regError"></div>
    <button class="btn pri" id="regOk" data-tx="registro.boton"></button>
  </section>

  <!-- 2a. MEMBRESÍA O PAQUETE (qué es cada uno, beneficios reales y letra chica) -->
  <section class="vista" id="vTipo">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="tipoTitulo"></h1>
    <p id="tipoSub"></p>
    <div class="planes2" id="tipoLista"></div>
    <div class="extra" id="tipoExtra"></div>
  </section>

  <!-- 2b. ELEMENTO (disciplinas y horarios reales) -->
  <section class="vista" id="vElemento">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="elTitulo"></h1>
    <p id="elSub"></p>
    <div class="planes2" id="elLista"></div>
    <div class="extra" id="elExtra"></div>
  </section>

  <!-- 2c. CLASES (precio y precio por clase) -->
  <section class="vista" id="vClases">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="clasesTitulo"></h1>
    <p id="clasesSub"></p>
    <div class="regalo-caja" id="clasesRegalo" hidden></div><!-- v9: interruptor «Ver con mi regalo de bienvenida» -->
    <div class="ops tiles" id="clasesLista"></div>
    <div class="extra" id="clasesExtra"></div>
  </section>

  <!-- v4: PLANES DE LARGO PLAZO (trimestrales y semestrales, con su ahorro real contra la mensual y el paquete) -->
  <section class="vista" id="vLargo">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="largoTitulo"></h1>
    <p id="largoSub"></p>
    <p id="largoFlex" class="flex-nota"></p>
    <div class="extra" id="largoLista"></div>
    <p class="nota" id="largoLetra"></p>
  </section>

  <!-- 2d. DURACIÓN -->
  <section class="vista" id="vDuracion">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="durTitulo"></h1>
    <p id="durSub"></p>
    <div class="regalo-caja" id="durRegalo" hidden></div>
    <div class="ops tiles dur" id="durLista"></div>
  </section>

  <!-- 2e. ¿Y SI MEJOR MEMBRESÍA? (solo si eligió paquete y la membresía sale más barata) -->
  <section class="vista" id="vEmpuje">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="empTitulo"></h1>
    <div class="empuje emp2" id="empCarta"></div>
    <div class="fila-btns">
      <button class="btn pri" id="empCambiar"></button>
      <button class="btn sec" id="empSeguir"></button>
    </div>
  </section>

  <!-- 3. RESUMEN -->
  <section class="vista" id="vResumen">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="resNombre"></h1>
    <div class="precio" id="resPrecio"></div>
    <div class="aviso-prueba" id="resPrueba" hidden></div>
    <div class="refuerzo" id="resRefuerzo" hidden></div>
    <div class="bien-caja" id="resBien" hidden></div><!-- promos: el regalo, arriba (lo decide el servidor) -->
    <div class="correo-app res-correo" id="resCorreoCaja"><small data-tx="resumen.correo"></small><div class="correo-grande grande" id="resCorreo"></div>
      <button class="btn sec" id="resCambiar" data-tx="resumen.cambiarCorreo" hidden></button></div>
    <div class="tarjeta" id="resFilas"></div>
    <div id="resInicio" hidden style="display:flex;flex-direction:column;gap:8px;align-items:center;width:100%">
      <label for="inicio" style="font-size:19px;color:var(--carbon)" id="inicioTxt"></label>
      <input class="campo" id="inicio" type="date">
    </div>
    <div class="letra tarjeta" id="resLetra"></div>

/** Distancia de edición con transposición (gmial ↔ gmail cuenta 1). */
function distanciaCorreo(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    const c = a[i - 1] === b[j - 1] ? 0 : 1;
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}

/** «ana arroba gmial.com» → «ana arroba gmail.com». null si se ve bien (o no se parece a ningún dominio común). */
function sugerirCorreo(email) {
  const m = /^([^@\s]+)@([a-z0-9.-]+)$/.exec(String(email || '').trim().toLowerCase());
  if (!m) return null;
  const usuario = m[1], dom = m[2].replace(/\.+$/, '');
  if (DOMINIOS_CORREO.includes(dom) || DOMINIOS_REALES.includes(dom)) return null;
  if (DOMINIOS_FIJOS[dom]) return usuario + '@' + DOMINIOS_FIJOS[dom];
  if (!dom.includes('.')) {                                   // «ana@gmail» → falta el .com
    const x = DOMINIOS_CORREO.find(y => distanciaCorreo(dom, y.split('.')[0]) <= (dom.length >= 5 ? 1 : 0));
    return x ? usuario + '@' + x : null;
  }
  let mejor = null, dm = Infinity;
  for (const x of DOMINIOS_CORREO) { const k = distanciaCorreo(dom, x); if (k < dm) { dm = k; mejor = x; } }
  return dm > 0 && dm <= (dom.length >= 9 ? 2 : 1) ? usuario + '@' + mejor : null;
}

/** Celular de México como lo hace el backend (celularMX): 52 o 521 al frente se quitan; nunca se recorta. null si no son 10. */
function celular10(s){
  let d = String(s || '').replace(/\D/g, '');
  // Con «+» al frente tiene que ser +52 (o +521) y 10 dígitos completos: un «+52 33 1234 56» recortado no pasa.
  if (/^\s*\+/.test(String(s || '')) && !((d.length === 12 && d.startsWith('52')) || (d.length === 13 && d.startsWith('521')))) return null;
  if (d.length === 12 && d.startsWith('52')) d = d.slice(2);
  else if (d.length === 13 && d.startsWith('521')) d = d.slice(3);
  return /^[1-9]\d{9}$/.test(d) ? d : null;
}

  regalo: '<rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M3 9h18M12 9v11M12 9c-1.5-3.5-5.5-4.5-5.5-2S10 9 12 9Zm0 0c1.5-3.5 5.5-4.5 5.5-2S14 9 12 9Z"/>'
};
/** v9: icono de un beneficio según lo que dice (los textos vienen de Wix; si ninguno cuadra, el destello de siempre). */
const icoPerk = x => (/cargo autom|gesti[oó]n extra/i.test(x) ? 'tarjeta' : /taller|evento/i.test(x) ? 'evento' : /chai|calena|restaur|bebida/i.test(x) ? 'taza'
  : /gracia/i.test(x) ? 'vigencia' : /invitad/i.test(x) ? 'invitada' : /barat|precio|ahorr/i.test(x) ? 'precio' : /tote|regal|paquete/i.test(x) ? 'regalo' : 'perk');
const ico = (k, t = 26) => `<svg class="ico" width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg>`;
// Corona de laurel (la misma del kiosco para «Miembro»).
const LAUREL_HOJAS = [[8.24,19.46,96],[5.33,16.82,125],[4.03,13.1,153],[4.66,9.21,182],[7.07,6.1,210],
  [15.76,19.46,84],[18.67,16.82,56],[19.97,13.1,27],[19.34,9.21,-1],[16.93,6.1,-30]]
  .map(([x, y, r]) => `<ellipse cx="${x}" cy="${y}" rx="1.8" ry="3.4" transform="rotate(${r} ${x} ${y})"/>`).join('');
const svgLaurel = (t = 48) => `<svg width="${t}" height="${t}" viewBox="0 0 24 24" aria-hidden="true">
  <g fill="none" stroke="var(--oro-tallo)" stroke-width="1.5" stroke-linecap="round"><path d="M10.6 20.3A8 8 0 0 1 6.6 6.3"/><path d="M13.4 20.3A8 8 0 0 0 17.4 6.3"/></g>
  <g fill="var(--oro)" stroke="var(--oro-borde)" stroke-width=".5">${LAUREL_HOJAS}</g></svg>`;
/** «desde $95 /clase» en grande. */
const heroe = (n, conDesde = true, nota = '') => `<div class="heroe">${conDesde ? `<span class="desde">${T('heroe.desde')}</span>` : ''}<span class="monto">${esc(pesos(n))}</span><span class="unidad">${T('heroe.porClase')}</span>${nota ? `<small class="heroe-nota">${nota}</small>` : ''}</div>`;
const puntos2 = (xs, icos) => `<ul class="puntos2">${xs.map((x, i) => `<li>${ico(icos[i] || 'unaVez')}<span>${x}</span></li>`).join('')}</ul>`;
/** v5.1: beneficios como lista compacta con icono (los textos de Wix son largos: en pastilla se partían en óvalos).
 *  xs = [{ x: texto, fam: 'solo …' }]. */
const perksLista = xs => (xs.length ? `<ul class="perks">${xs.map(o => `<li>${ico(icoPerk(o.x), 20)}<span>${esc(o.x)}${o.fam ? `<small>${esc(o.fam)}</small>` : ''}</span></li>`).join('')}</ul>` : '');

/* Panel «ⓘ Condiciones»: cada ficha guarda su contenido con una clave; el enlace lo abre encima, «Entendido» lo cierra. */
const HOJAS = new Map();
function enlaceHoja(clave, titulo, cuerpo, mas = 0){ HOJAS.set(clave, { titulo, cuerpo });
  return `<button type="button" class="cond" data-hoja="${esc(clave)}">${T('hoja.condiciones')}${mas > 0 ? `<span class="mas">${T(mas === 1 ? 'hoja.mas1' : 'hoja.mas', { n: mas })}</span>` : ''}</button>`; }
function abrirHoja(clave){ const h = HOJAS.get(clave); if (!h) return; $('hojaTit').textContent = h.titulo; $('hojaCuerpo').innerHTML = h.cuerpo; $('hoja').hidden = false;
  $('hoja').querySelector('.hoja').scrollTop = 0; conectarCarruseles($('hojaCuerpo')); }   // v9: la hoja de Dúo/Tribu es un carrusel
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-hoja]'); if (b) { e.stopPropagation(); abrirHoja(b.dataset.hoja); } }, true);
$('hojaCerrar').onclick = () => { $('hoja').hidden = true; };
$('hoja').addEventListener('click', e => { if (e.target === $('hoja')) $('hoja').hidden = true; });

/** Mayor ahorro por clase (en %) de una membresía contra el paquete de las MISMAS clases que ya le calcula el backend
 *  (`equivalente.cent`, centavos: paquete hacia abajo y membresía hacia arriba), redondeado hacia abajo: nunca promete de más.
 *  0 si no hay ninguna comparación así. */
const ahorroHasta = ms => Math.max(0, ...ms.map(m => { const e = m.equivalente, c = e && e.cent;
  return e && c && e.clases === m.clases && c.porClasePaquete > 0 && c.ahorroClase > 0 ? Math.floor(c.ahorroClase * 100 / c.porClasePaquete) : 0; }));

/** 2a. ¿Membresía o paquete? Qué es cada uno, beneficios (perks reales) y letra chica (términos reales). */
function irTipo(){
  const B = CAT.beneficios || {}, BM = B.membresia || {}, BP = B.paquete || {};
  const ms = CAT.planes.filter(p => p.tipo === 'membresia'), ps = CAT.planes.filter(p => p.tipo === 'paquete');
  $('tipoTitulo').textContent = Tt('tipo.titulo'); $('tipoSub').textContent = Tt('tipo.sub');
  const cartas = [];
  if (ms.length) {
    // El precio grande es el de las que se cobran cada ciclo; las trimestrales/semestrales van en la franja con su «desde».
    const cortas = ms.filter(p => !p.largo), base = cortas.length ? cortas : ms, d = desde(base);
    // v9 (Olmo, 9-nov, opción B): el «Ahorras hasta X%» y su ejemplo, con los planes de 12 clases, como el precio grande.
    const base12 = doceDe(base), baseAh = base12.length ? base12 : base, pct = ahorroHasta(baseAh);
    const fam = g => lista((g.familias || []).map(f => Tt('tipo.membresia.familias.' + f) || f));
    // v9 (Olmo, 9-nov: «hazlo más llamativo»): bloque destacado «Beneficios de membresía» con icono por beneficio: el ahorro
    // contra el paquete (catálogo) y los beneficios de Wix de las membresías del precio grande (beneficiosPorTipo: los de
    // todas y los de su familia). Los de trimestral y semestral, en «ⓘ Condiciones» (el enlace dice cuántos son).
    const fams = new Set(base.map(p => p.familia)), gruposFicha = (BM.grupos || []).filter(g => (g.familias || []).some(f => fams.has(f)));
    const perksFicha = [...gruposFicha.flatMap(g => g.perks || []), ...(BM.todas || [])].filter((x, i, xs) => xs.indexOf(x) === i);
    const masLargo = (BM.grupos || []).filter(g => !gruposFicha.includes(g)).reduce((n, g) => n + (g.perks || []).length, 0);
    const famPerks = g => perksLista((g.perks || []).map(x => ({ x })));
    let cuerpo = '';
    // Olmo 9-nov: clases extra a precio de clase de prueba (CONFIG_ALTA.precioClaseExtra), en todas las membresías.
    const extra = CFG.precioClaseExtra > 0 ? Tt('tipo.membresia.claseExtraLinea', { precio: pesos(CFG.precioClaseExtra) }) : '';
    if ((BM.todas || []).length || extra) cuerpo += `<h3>${T('tipo.membresia.todas')}</h3>${perksLista([...(extra ? [extra] : []), ...(BM.todas || [])].map(x => ({ x })))}`;
    for (const g of BM.grupos || []) if ((g.perks || []).length) cuerpo += `<h3>${T('tipo.membresia.solo', { familias: fam(g) })}</h3>${famPerks(g)}`;
    if (BM.cancelacion) cuerpo += `<h3>${T('tipo.membresia.letraChica')}</h3><p>${esc(BM.cancelacion)}</p>`;
    // El ejemplo concreto del «hasta X%» (el plan donde pasa), para que no parezca contradecir los «desde».
    const ej = pct > 0 ? baseAh.find(m => ahorroHasta([m]) === pct) : null;
    const ejTxt = ej ? T('tipo.membresia.ahorroEjemplo', { elemento: EL[ej.elemento] ? EL[ej.elemento][1] : ej.elemento, clases: ej.clases,
      porClase: pesos(ej.equivalente.porClaseMembresia), porClasePaquete: pesos(ej.equivalente.porClasePaquete) }) : '';   // pesos cerrados (los centavos, solo en el empuje)
    const items = [pct > 0 ? `<li class="ben-ahorro">${ico('ahorro', 22)}<span><b>${T('tipo.membresia.ahorro', { pct })}</b><small>${T('tipo.membresia.ahorroNota')}${ejTxt ? ` · ${ejTxt}` : ''}</small></span></li>` : '',
      CFG.precioClaseExtra > 0 ? `<li>${ico('precio', 22)}<span><b>${T('tipo.membresia.claseExtra', { precio: pesos(CFG.precioClaseExtra) })}</b><small>${T('tipo.membresia.claseExtraNota')}</small></span></li>` : '',
      ...perksFicha.map(x => `<li>${ico(icoPerk(x), 22)}<span>${esc(x)}</span></li>`)].filter(Boolean);
    const bloqueBen = items.length ? `<div class="ben"><div class="ben-tit">${svgLaurel(26)}<span>${T('tipo.membresia.beneficiosTit')}</span></div><ul>${items.join('')}</ul></div>` : '';
    // v9: el precio grande, con el plan de 12 clases (ver doceDe).
    const doce = doceDe(base), dd = doce.length ? desde(doce) : d;
    cartas.push(`<div class="carta plan reco"><span class="sello">${T('tipo.membresia.sello')}</span>
      <div class="cab">${svgLaurel(52)}<div><h2>${T('tipo.membresia.nombre')}</h2><div class="lema">${T('tipo.membresia.lema')}</div></div></div>
      ${Number.isFinite(dd) ? heroe(dd, true, doce.length ? T('tipo.membresia.doce', { clases: CLASES_REF }) : base !== ms ? T('tipo.membresia.sinLargo') : '') : ''}
      ${bloqueBen}
      ${cuerpo ? `<button type="button" class="cond" data-hoja="tipo-membresia">${T('hoja.condiciones')}${masLargo > 0 ? `<span class="mas">${T('tipo.membresia.masLargo', { n: masLargo })}</span>` : ''}</button>` : ''}
      <button class="btn pri" data-t="membresia">${T('tipo.membresia.boton')}</button></div>`);
    if (cuerpo) HOJAS.set('tipo-membresia', { titulo: Tt('tipo.membresia.nombre'), cuerpo });
  }
  if (ps.length) {
    const doce = doceDe(ps), d = doce.length ? desde(doce) : desde(ps);
    const cuerpo = `<p>${T('tipo.paquete.unaVez')}</p>${(BP.vigencias || []).length ? `<p>${T('tipo.paquete.vigencias', { vigencias: lista(BP.vigencias) })}</p>` : ''}`
      + ((BP.todas || []).length ? `<h3>${T('tipo.membresia.beneficios')}</h3>${ul(BP.todas.map(esc))}` : '');
    const perksP = (BP.todas || []).slice(0, 2).map(x => ({ x }));
    cartas.push(`<div class="carta plan">
      <div class="cab">${ico('paquete', 50)}<div><h2>${T('tipo.paquete.nombre')}</h2><div class="lema">${T('tipo.paquete.lema')}</div></div></div>
      ${Number.isFinite(d) ? heroe(d, true, doce.length ? T('tipo.paquete.doce', { clases: CLASES_REF }) : '') : ''}
      ${puntos2(TX.tipo.paquete.puntos.map((_, i) => T('tipo.paquete.puntos.' + i)), ['unaVez', 'vigencia'])}
      ${perksLista(perksP)}
      ${enlaceHoja('tipo-paquete', Tt('tipo.paquete.nombre'), cuerpo, (BP.todas || []).length - perksP.length)}
      <button class="btn sec" data-t="paquete">${T('tipo.paquete.boton')}</button></div>`);
  }
  $('tipoLista').innerHTML = cartas.join('');
  $('tipoLista').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { A.tipo = b.dataset.t; irElemento(); });
  // v4: el botón aparte de trimestrales y semestrales (de todos los elementos: aún no elige) y, si existe, el plan de prueba.
  const pr = CAT.prueba;
  $('tipoExtra').innerHTML = botonLargo(null) + bloquePromos() + (pr ? `<div class="carta prueba"><div class="grupo">${T('prueba.seccion')}</div><h2>${esc(pr.nombre)}</h2>
    <div>${pr.recurrente ? T('prueba.cobroRecurrente', { precio: pesos(pr.precio), cada: cadaDe(pr.cicloTexto) }) : esc(precioCon(pr))}</div><div class="chica">${T('prueba.aviso')}</div><button class="btn sec" data-prueba="1">${T('prueba.boton')}</button></div>` : '');
  conectarLargo($('tipoExtra'));
  const bp = $('tipoExtra').querySelector('[data-prueba]');
  if (bp) bp.onclick = () => { A.tipo = pr.tipo; A.elemento = null; A.clases = null; elegirPlan(pr); };
  ir('vTipo');
}

/* --------------------------------------------------------------- v4: planes de largo plazo (trimestrales y semestrales) */
/** Franja de trimestrales y semestrales de «¿Membresía o paquete?» (v5; v7: con el estilo del bloque «Si pagas por adelantado»
 *  y el título que dice que se paga por adelantado). el = null → de todos los elementos. Presume («más baratos que la mensual y
 *  el paquete de las mismas clases») solo si el backend dice que es cierto (CAT.largo.masBarato, por elemento o en total). */
function botonLargo(el){
  const L = CAT.largo || {}, x = el ? (L.elementos || {})[el] : L;
  if (!x || !x.n) return '';
  // v5: franja de una línea con el «desde» real de esos planes y, debajo, la frase completa.
  // Revisión v9: el «desde» con las de 12 clases (el criterio de las fichas de arriba); si no hay de 12, todas.
  const ls = CAT.planes.filter(p => p.largo && (!el || p.elemento === el)), l12 = ls.filter(p => !p.ilimitada && p.clases === CLASES_REF);
  const base = l12.length ? l12 : ls, d = desde(base);
  // Revisión v7: con el «desde» va lo que se paga de golpe en ESE plan (el primero del catálogo si empatan), para que el precio
  // bajo no se lea como un precio de cada mes junto a los «desde» de la membresía y el paquete.
  const pd = base.find(p => ppc(p) === d);
  return `<button class="franja" data-largo="${esc(el || '')}"><span class="estrella" aria-hidden="true">${ico('vigencia')}</span><span class="txt">
    <span class="fila1"><span class="tit">${T(x.masBarato ? 'largo.boton' : 'largo.botonSinPresumir')}</span>
    ${Number.isFinite(d) ? `<span class="lin">${T(l12.length ? 'largo.botonDoce' : 'largo.botonDesde', { porClase: pesos(d), clases: CLASES_REF })} · ${T('largo.botonPago', { precio: pesos(pd.precio), cada: cadaDe(pd.cicloTexto) })}</span>` : ''}</span>
    <span class="sub2">${T(x.masBarato ? 'largo.botonSub' : 'largo.botonSubSinPresumir')}</span></span><span class="flecha" aria-hidden="true">›</span></button>`;
}
/** v7 (Olmo, 9-nov): las trimestrales y semestrales que van en el bloque aparte, una por grupo (en la pantalla de elementos,
 *  una por elemento: la más barata por clase; si empatan, la primera del catálogo). Las de cada mes no entran. */
const filasAdelantado = (planes, clave) => { const m = new Map();
  for (const p of planes) if (p.largo && p.precioPorClase) { const k = clave(p), a = m.get(k); if (!a || p.precioPorClase < a.precioPorClase) m.set(k, p); }
  return [...m.values()]; };
/** v7: bloque «Si pagas por adelantado (3 o 6 meses)», debajo de las fichas y con otro estilo. Cada renglón: el plan, su precio
 *  por clase Y lo que se paga de golpe. conElemento: en la pantalla de elementos, un renglón por elemento. Un toque lleva a
 *  «Planes trimestrales y semestrales» (del elemento elegido, o con pestañas). */
function bloqueAdelantado(filas, el, conElemento){
  if (!filas.length) return '';
  const L = CAT.largo || {}, x = el ? (L.elementos || {})[el] : L, presume = !!(x && x.masBarato);
  const nums = (p, dur = '') => `<span class="adel-num">${dur}<span class="adel-ppc">${T('adelantado.porClase', { porClase: pesos(p.precioPorClase) })}</span><span class="adel-pago">${T('adelantado.pagas', { precio: pesos(p.precio), cada: cadaDe(p.cicloTexto) })}</span></span>`;
  const fila = p => `<span class="adel-fila"><span class="adel-plan"><i style="background:${EL[p.elemento][0]}" aria-hidden="true"></i><b>${EL[p.elemento][1]}</b> · ${esc(Tt('adelantado.plan', { clases: textoClases(claveClases(p), [p]), duracion: p.etiquetaDuracion.toLowerCase() }))}</span>
    ${nums(p)}</span>`;
  // Revisión v7: en «¿cuántas clases?», un renglón por número de clases con la trimestral y la semestral lado a lado (en vez
  // de uno por plan): el bloque pesa menos que las fichas de cada mes de arriba.
  const grupos = [...new Set(filas.map(claveClases))].map(g => filas.filter(p => claveClases(p) === g));
  // v9: con su anual (del PDF, «en recepción») como tercera celda; en celular las celdas se deslizan a la derecha.
  const celdaAnual = a => `<span class="adel-num adel-anual"><span class="adel-dur">${T('adelantado.anualDur')}</span><span class="adel-ppc">${T('adelantado.porClase', { porClase: pesos(a.porClase) })}</span><span class="adel-pago">${T('adelantado.anualPagas', { precio: pesos(a.total) })}</span></span>`;
  const par = xs => { const an = el ? anualDe(el, claveClases(xs[0])) : null;
    return `<span class="adel-fila adel-par"><span class="adel-plan">${esc(textoClases(claveClases(xs[0]), xs))}</span>
    <span class="adel-celdas${an ? ' con-anual' : ''}">${xs.map(p => nums(p, `<span class="adel-dur">${esc(p.etiquetaDuracion)}</span>`)).join('')}${an ? celdaAnual(an) : ''}</span></span>`; };
  // En «¿qué elemento?», una línea al pie con el anual más barato por clase de todos (tampoco se cobra en la tablet).
  const anuales = conElemento ? ORDEN_EL.flatMap(e => Object.keys((ANU.precios || {})[e] || {}).map(g => anualDe(e, g))).filter(Boolean) : [];
  const conAnual = conElemento ? anuales.length > 0 : grupos.some(xs => anualDe(el, claveClases(xs[0])));
  // Revisión v9: «desde» con los anuales de 12 clases (el mismo criterio que la primera pantalla); si no hay, todos.
  const an12 = anuales.filter(a => a.n === CLASES_REF), anRef = an12.length ? an12 : anuales;
  const lineaAnual = anuales.length ? `<span class="adel-anual-linea">${T(an12.length ? 'adelantado.anualLineaDoce' : 'adelantado.anualLinea', { porClase: pesos(Math.min(...anRef.map(a => a.porClase))), clases: CLASES_REF })}</span>` : '';
  // v9: ya no es un <button> (adentro hay celdas que se deslizan): un div con role="button" (Enter o espacio lo abren).
  return `<div class="adel" data-largo="${esc(el || '')}" role="button" tabindex="0"><span class="adel-cab"><span class="adel-ico" aria-hidden="true">${ico('vigencia')}</span><span class="txt">
    <span class="adel-tit">${T(conAnual ? 'adelantado.tituloAnual' : 'adelantado.titulo')}</span><span class="adel-sub">${T(presume ? 'adelantado.sub' : 'adelantado.subSinPresumir')}</span><span class="adel-flex">${T('adelantado.flexible')}</span></span></span>
    <span class="adel-filas">${conElemento ? filas.map(fila).join('') : grupos.map(par).join('')}</span>${lineaAnual}<span class="adel-pie">${T('adelantado.ver')} ›</span></div>`;
}
function conectarLargo(caja){ caja.querySelectorAll('[data-largo]').forEach(b => b.onclick = () => irLargo(b.dataset.largo || null)); }
/** v5.1: entrando sin elemento (desde «¿Membresía o paquete?») ya no salen las 24 tarjetas: pestañas por elemento, abre en el
 *  de menor «desde». En cada elemento, una fila por número de clases con la trimestral y la semestral lado a lado. */
function irLargo(el, pestanas = false){
  const L = CAT.largo || {}, todos = CAT.planes.filter(p => p.largo);
  const els = ORDEN_EL.filter(e => todos.some(p => p.elemento === e)), dEl = e => desde(todos.filter(p => p.elemento === e));
  if (!el) { pestanas = true; el = els.reduce((m, e) => (m && dEl(m) <= dEl(e) ? m : e), null); if (!el) return; }
  const info = (L.elementos || {})[el] || (pestanas ? L : null), presume = !!(info && info.masBarato);
  const xs = todos.filter(p => p.elemento === el);
  $('largoTitulo').textContent = pestanas ? Tt('largo.titulo') : Tt('largo.tituloEl', { elemento: EL[el][1] });
  $('largoSub').textContent = Tt(presume ? 'largo.sub' : 'largo.subSinPresumir');
  $('largoFlex').innerHTML = T('largo.flexible');
  const datos = (p, c) => ({ nombre: c.nombre, porClase: pesos(c.porClase), porClaseOtro: pesos(c.porClaseOtro), ahorroClase: pesos(c.ahorroClase),
    ahorroPeriodo: pesos(c.ahorroPeriodo), periodo: p.cicloTexto });
  // La frase completa (con el nombre de Wix del plan con que compara) va en «ⓘ Condiciones» y en aria-label; a la vista, dos niveles.
  const frase = (p, c, k) => Tt(c.masBarato ? `largo.${k}` : `largo.${k}No`, datos(p, c));
  const cmp = (p, c, k) => (!c ? '' : `<p class="lg-vs${c.masBarato ? '' : ' no'}" aria-label="${esc(frase(p, c, k))}">
    <b class="lg-ah">${T(c.masBarato ? 'largo.ahorras' : 'largo.noAhorras', datos(p, c))}</b>
    <small>${T(c.masBarato ? 'largo.detalle' : 'largo.detalleNo', { ...datos(p, c), contra: Tt('largo.contra.' + k) })}</small></p>`);
  // Los beneficios que traen TODAS las membresías (p. ej. el de Chai/Calena) no se repiten en cada tarjeta: ya están en la ficha
  // de membresía, en sus condiciones y en el resumen antes de pagar. Aquí solo lo propio de cada plan (semanas de gracia, pase).
  const comunes = new Set(((CAT.beneficios || {}).membresia || {}).todas || []);
  const carta = p => {
    const canc = (p.letraChica || []).find(l => /cancelaci[oó]n anticipada/i.test(l));
    const comp = [p.largo.mensual && frase(p, p.largo.mensual, 'vsMensual'), p.largo.paquete && frase(p, p.largo.paquete, 'vsPaquete')].filter(Boolean);
    const letra = (comp.length ? `<h3>${T('largo.comparacion')}</h3>${ul(comp.map(esc))}` : '')
      + (canc ? `<h3>${T('largo.cancelacion')}</h3><p>${esc(canc)}</p>${p.largo.compromiso ? `<p>${T('largo.compromiso', { meses: p.largo.compromiso })}</p>` : ''}` : '');
    return `<div class="carta plan elegible lg-carta" data-id="${esc(p.planId)}" role="button" tabindex="0" aria-label="${esc(p.nombre)}">
      <span class="lg-fam">${esc(p.etiquetaDuracion)}</span>
      <div class="lg-nums">${p.precioPorClase ? `<div class="lg-n ppc"><small>${T('largo.porClaseEt')}</small><b>${esc(pesos(p.precioPorClase))}</b></div>` : ''}
        <div class="lg-n"><small>${T('largo.pagoEt')}</small><b>${esc(pesos(p.precio))}</b><span>${T('largo.pagoPie', { cada: cadaDe(p.cicloTexto) })}</span></div></div>
      ${perksLista((p.perks || []).filter(x => !comunes.has(x)).slice(0, 3).map(x => ({ x })))}
      ${cmp(p, p.largo.mensual, 'vsMensual')}${cmp(p, p.largo.paquete, 'vsPaquete')}${notaFaltan([p])}
      ${letra ? enlaceHoja('largo-' + p.planId, Tt('largo.condiciones'), letra) : ''}
      <div class="el-pie">${T('largo.elegir')} ›</div></div>`;
  };
  const tabs = pestanas ? `<div class="lg-tabs" role="tablist">${els.map(e => `<button class="lg-tab${e === el ? ' activa' : ''}" role="tab" aria-selected="${e === el}" data-tab="${e}">${svgEl(e, 36)}
    <span class="txt"><b>${EL[e][1]}</b><small>${T('heroe.desde')} ${esc(pesos(dEl(e)))}</small></span></button>`).join('')}</div>` : '';
  const grupos = [...new Set(xs.map(claveClases))].sort((a, b) => (a === 'ilimitada') - (b === 'ilimitada') || +a - +b);
  // v9 (Olmo, 9-nov): cada número de clases es un carrusel (trimestral · semestral · anual): se desliza a la derecha para ver
  // el anual (del PDF; se contrata en recepción, la tablet no lo cobra).
  $('largoLista').innerHTML = tabs + grupos.map(g => { const gx = xs.filter(p => claveClases(p) === g).sort((a, b) => (a.diasCiclo || 0) - (b.diasCiclo || 0));
    const an = anualDe(el, g), tarjetas = gx.map(carta).concat(an ? [cartaAnual(an)] : []);
    return `<h2 class="lg-grupo">${esc(textoClases(g, gx))}</h2>${carrusel(tarjetas, textoClases(g, gx), an ? Tt('largo.desliza') : '')}`; }).join('');
  $('largoLetra').textContent = Tt('largo.letra');
  $('largoLista').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => irLargo(b.dataset.tab, true));
  $('largoLista').querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
    const p = xs.find(x => x.planId === b.dataset.id); if (!p) return;
    A.tipo = 'membresia'; A.elemento = p.elemento; A.clases = claveClases(p); elegirPlan(p, { desdeLargo: true });
  });
  // El anual NO avanza al pago: abre su hoja («Se contrata en recepción»).
  $('largoLista').querySelectorAll('[data-anual]').forEach(b => b.onclick = () => abrirHoja(b.dataset.anual));
  ir('vLargo');
  conectarCarruseles($('largoLista'));
}

/* --------------------------------------------------------------- v9: planes anuales (PDF «Planes Largo Plazo 2026»)
   No existen en Wix: la tabla vive en textos-alta.js (ANUALES_ALTA). Se enseñan junto a la trimestral y la semestral, pero la
   tablet no los cobra: tocarlos abre una hoja que dice que se contratan en recepción. El ahorro se calcula contra la mensual
   de las mismas clases del catálogo de Wix (12 cobros), solo si es cierto. */
const ANU = typeof ANUALES_ALTA !== 'undefined' ? ANUALES_ALTA : { precios: {}, beneficios: [], msi: null };
function anualDe(el, g){
  const total = ((ANU.precios || {})[el] || {})[g]; if (!total || !(+g > 0)) return null;
  const n = +g, porClase = total / (n * 12), clave = `anual-${el}-${n}`;
  const m = CAT.planes.find(p => p.tipo === 'membresia' && p.elemento === el && p.clases === n && p.duracion === 'mensual' && !p.largo);
  const ahorro = m && m.precio * 12 > total ? m.precio * 12 - total : 0;
  return { el, n, total, porClase, clave, ahorro, pct: ahorro ? Math.floor(ahorro * 100 / (m.precio * 12)) : 0 };
}
function cartaAnual(a){
  const msi = ANU.msi && a.total >= ANU.msi.desde ? ANU.msi : null;
  const ah = a.ahorro ? `<p class="lg-vs"><b class="lg-ah">${T('anual.ahorras', { ahorro: pesos(a.ahorro) })}</b><small>${T('anual.detalle', { pct: a.pct })}</small></p>` : '';
  HOJAS.set(a.clave, { titulo: Tt('anual.hojaTit', { elemento: EL[a.el][1], clases: a.n }), cuerpo: `<p class="an-aviso">${T('anual.hojaTexto')}</p>
    <p>${T('anual.total', { precio: pesos(a.total), porClase: pesos(a.porClase) })}</p>${ah}
    <h3>${T('anual.incluye')}</h3>${perksLista((ANU.beneficios || []).map(x => ({ x })))}
    ${msi ? `<p class="an-msi">${T('anual.msiTxt', { meses: msi.meses, desde: pesos(msi.desde) })}</p>` : ''}<p class="nota">${T('anual.letra')}</p>` });
  return `<div class="carta plan elegible lg-carta lg-anual" data-anual="${esc(a.clave)}" role="button" tabindex="0" aria-label="${esc(Tt('anual.hojaTit', { elemento: EL[a.el][1], clases: a.n }) + '. ' + Tt('anual.recepcion'))}">
    <span class="lg-fam-fila"><span class="lg-fam">${T('anual.fam')}</span><span class="an-recep">${T('anual.recepcion')}</span></span>
    <div class="lg-nums"><div class="lg-n ppc"><small>${T('anual.porClaseEt')}</small><b>${esc(pesos(a.porClase))}</b></div>
      <div class="lg-n"><small>${T('anual.pagoEt')}</small><b>${esc(pesos(a.total))}</b><span>${msi ? T('anual.pagoPie', { meses: msi.meses }) : ''}</span></div></div>
    ${perksLista((ANU.beneficios || []).slice(0, 3).map(x => ({ x })))}${ah}
    <div class="el-pie">${T('anual.pie')} ›</div></div>`;
}

/* --------------------------------------------------------------- v9: carrusel (anuales y hoja de Dúo/Tribu)
   Desliza con el dedo (scroll-snap nativo), con flechas o con los puntos. Respeta prefers-reduced-motion. */
const sinMovimiento = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function carrusel(slides, etiqueta, pista = '', clase = ''){
  const n = slides.length;
  return `<div class="carr${clase ? ' ' + clase : ''}"><div class="carr-pista" tabindex="0" role="region" aria-roledescription="carrusel" aria-label="${esc(etiqueta)}">
    ${slides.map((x, i) => `<div class="carr-item" role="group" aria-roledescription="diapositiva" aria-label="${i + 1} de ${n}">${x}</div>`).join('')}</div>
    <div class="carr-ctl"><button type="button" class="carr-fl" data-dir="-1" aria-label="Anterior">‹</button>
      <span class="carr-puntos">${slides.map((_, i) => `<button type="button" class="carr-p" data-i="${i}" aria-label="Ir a la ${i + 1} de ${n}"></button>`).join('')}</span>
      <button type="button" class="carr-fl" data-dir="1" aria-label="Siguiente">›</button>${pista ? `<span class="carr-pista-txt">${esc(pista)}</span>` : ''}</div></div>`;
}
function conectarCarruseles(raiz){
  raiz.querySelectorAll('.carr').forEach(c => {
    const pista = c.querySelector('.carr-pista'), items = [...pista.children], puntos = [...c.querySelectorAll('.carr-p')], fl = c.querySelectorAll('.carr-fl');
    const hoja = c.classList.contains('carr-hoja');
    // Revisión v9: un punto por cada posición a la que se puede llegar (si caben 2 tarjetas y sobra un poco, las de en medio no
    // se alcanzan: su punto no sale); la última posición es «hasta el final».
    const off = i => items[i].offsetLeft - items[0].offsetLeft, max = () => Math.max(0, pista.scrollWidth - pista.clientWidth);
    const posiciones = () => { const m = max(), ps = items.map((_, i) => i).filter(i => off(i) < m - 2); ps.push(items.length - 1); return [...new Set(ps)]; };
    const actual = ps => { const m = max(); if (m > 2 && pista.scrollLeft >= m - 2) return items.length - 1;
      return ps.reduce((a, i) => (Math.abs(off(i) - pista.scrollLeft) < Math.abs(off(a) - pista.scrollLeft) ? i : a), ps[0]); };
    const pinta = () => { const ps = posiciones(), i = actual(ps), cabe = pista.scrollWidth <= pista.clientWidth + 2;
      c.classList.toggle('cabe', cabe); c.classList.toggle('fin', i === items.length - 1);
      puntos.forEach((p, k) => { p.hidden = !ps.includes(k); p.setAttribute('aria-current', String(k === i)); });
      fl[0].disabled = i === ps[0]; fl[1].disabled = i === ps[ps.length - 1];
      // Revisión v9: en la hoja de Dúo/Tribu la pista mide lo que la diapositiva que se ve (sin el hueco de la más alta).
      if (hoja) pista.style.height = (items[i].offsetHeight + 12) + 'px'; };
    const a = i => { i = Math.max(0, Math.min(items.length - 1, i)); pista.scrollTo({ left: Math.min(off(i), max()), behavior: sinMovimiento() ? 'auto' : 'smooth' }); };
    fl.forEach(b => b.onclick = e => { e.stopPropagation(); const ps = posiciones(), k = ps.indexOf(actual(ps)); a(ps[Math.max(0, Math.min(ps.length - 1, k + +b.dataset.dir))]); });
    puntos.forEach(b => b.onclick = e => { e.stopPropagation(); a(+b.dataset.i); });
    let raf = 0; pista.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(pinta); }, { passive: true });
    c._pinta = pinta; pinta();
  });
}
window.addEventListener('resize', () => document.querySelectorAll('.carr').forEach(c => c._pinta && c._pinta()));
// v9: las tarjetas que son role="button" (no <button>) también se eligen con Enter o espacio desde el teclado.
document.addEventListener('keydown', e => { const t = e.target; if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.tagName !== 'BUTTON') { e.preventDefault(); t.click(); } });

/** 2b. Elemento: disciplinas (Bookings) y, en su botón, la agenda de la semana (v6). */
function disciplinasDeElemento(el){
  const e = (CAT.elementos || {})[el];
  if (e && e.disciplinas && e.disciplinas.length) return e.disciplinas;
  const p = CAT.planes.find(x => x.elemento === el && x.textoDisciplinas);
  return p ? [p.textoDisciplinas] : [];
}
function irElemento(navegar = true){
  const els = ORDEN_EL.filter(el => CAT.planes.some(p => p.tipo === A.tipo && p.elemento === el));
  $('elTitulo').textContent = Tt('elemento.titulo'); $('elSub').textContent = Tt('elemento.sub');
  // v5.1: cabecera con el color del elemento y su «desde» (el MISMO criterio que la ficha de membresía: sin trimestral ni
  // semestral; v7: esas van en el bloque aparte de debajo de las fichas, no en la ficha). v6: las disciplinas con el color que tienen en la agenda y el botón

    const disc = ds.length ? `<div class="el-disc-tit">${T('elemento.disciplinas')}</div><ul class="el-disc">${ds.map(x => `<li><i style="background:${colorDe(x)[0]}" aria-hidden="true"></i>${esc(x)}</li>`).join('')}</ul>` : '';
    const ver = conHorarios(ds).length ? `<button type="button" class="ver-ag" data-agenda="${el}">${ico('vigencia', 22)}${T('elemento.verHorarios')}</button>` : '';
    return `<div class="carta elegible el-carta" data-e="${el}" role="button" tabindex="0" aria-label="${esc(Tt('elemento.elegir', { elemento: EL[el][1] }) + '. ' + Tt('elemento.incluye', { disciplinas: lista(ds) }))}" style="--c:${EL[el][0]}${el === 'AGUA' ? ';--o:.24' : ''}">
      <div class="el-cab">${svgEl(el, 52)}<h2>${EL[el][1]}</h2>${Number.isFinite(dd) ? `<div class="el-precio"><small>${doce.length ? T('elemento.doce', { clases: CLASES_REF }) : T('heroe.desde')}</small><b>${esc(pesos(dd))}</b><span>${T('heroe.porClase')}</span></div>` : ''}</div>
      <div class="el-cuerpo">${disc}${ver}
      <div class="el-pie">${T('elemento.elegir', { elemento: EL[el][1] })} ›</div></div></div>`;
  }).join('');
  $('elLista').querySelectorAll('[data-e]').forEach(b => b.onclick = () => { A.elemento = b.dataset.e; irClases(); });
  // v7: un renglón por elemento (su trimestral o semestral más barata por clase), aparte.

  const candL = CAT.planes.filter(p => p.tipo === A.tipo && els.includes(p.elemento)), doceL = e => candL.some(p => p.largo && p.elemento === e && p.clases === CLASES_REF);
  const filas = filasAdelantado(candL.filter(p => !doceL(p.elemento) || p.clases === CLASES_REF), p => p.elemento)
    .sort((a, b) => ORDEN_EL.indexOf(a.elemento) - ORDEN_EL.indexOf(b.elemento));
  $('elExtra').innerHTML = bloqueAdelantado(filas, null, true); conectarLargo($('elExtra'));

/* --------------------------------------------------------------- v6: agenda de la semana (estilo «Weekly Schedule» de Hera)
   Filas = horas reales (7:00 AM, 6:30 PM: el formato del Instagram de Hera, el que ya conocen sus clientas), columnas = días
   (LUN a SÁB; DOM solo si hay clases), un círculo por clase con el día adentro y el color de su disciplina (revisión v6:
   todos del mismo tamaño y cada disciplina en su lugar fijo de la celda). «BREAK» entre la última clase antes de las 13:00
   y la primera después. La leyenda, en la cabecera, filtra: tocar una disciplina deja solo esa; tocarla otra vez, todas.
   Datos: altaHorarios (cada día y hora con lugar en los próximos 14 días). Texto de los círculos: blanco sobre vino; casi negro sobre los colores claros
   (contraste ≥ 4.5 con el blanco no se alcanza en naranja, salvia ni azul gris). */
const COLOR_DISC = [[/reformer/i, 'var(--ag-vino)', '#fff'], [/\bmat\b/i, 'var(--ag-naranja)', '#1A1A1A'], [/barre/i, 'var(--ag-salvia)', '#1A1A1A'], [/yoga/i, 'var(--ag-azul)', '#1A1A1A']];
const colorDe = n => (COLOR_DISC.find(([re]) => re.test(n)) || [null, 'var(--ag-carbon)', '#fff']).slice(1);
const conHorarios = ds => (HOR ? ds.filter(x => (HOR[x] || []).length) : []);
const DIAS_SEMANA = [1, 2, 3, 4, 5, 6, 0];
/** '18:30' → ['6:30', 'PM'] */
const hora12 = h => { const [H, M] = String(h).split(':').map(Number); return [`${H % 12 || 12}:${String(M).padStart(2, '0')}`, Tt(H < 12 ? 'agenda.am' : 'agenda.pm')]; };
let agEl = null, agFiltro = null, agDesde = null;
function abrirAgenda(el, boton){
  if (!EL[el] || !HOR) return;
  agEl = el; agFiltro = null; agDesde = boton || null;
  pintarAgenda(); $('agenda').hidden = false; $('agenda').scrollTop = 0; document.body.classList.add('sin-scroll');
  setTimeout(() => $('agCerrar').focus(), 30);
}
function cerrarAgenda(enfocar = true){
  if ($('agenda').hidden) return;
  $('agenda').hidden = true; document.body.classList.remove('sin-scroll');
  if (enfocar && agDesde && document.contains(agDesde)) agDesde.focus();
  agDesde = null;
}
function pintarAgenda(){
  const ds = conHorarios(disciplinasDeElemento(agEl)), vis = agFiltro ? ds.filter(x => x === agFiltro) : ds;
  const dias = DIAS_SEMANA.filter(d => d !== 0 || ds.some(x => HOR[x].some(c => c.d === 0)));
  const horas = [...new Set(vis.flatMap(x => HOR[x].map(c => c.h)))].sort();
  $('agTit').textContent = Tt('agenda.titulo', { elemento: EL[agEl][1] });
  $('agDisc').textContent = lista(ds); $('agNota').textContent = Tt('agenda.nota'); $('agCerrar').textContent = Tt('agenda.cerrar');
  const circulo = (x, d, h) => { const [bg, tx] = colorDe(x), [hh, ap] = hora12(h);
    return `<span class="ag-c" role="img" style="--bg:${bg};--tx:${tx}" aria-label="${esc(`${x}, ${TX.agenda.diasLargos[d]} ${hh} ${ap}`)}">${esc(TX.agenda.dias[d])}</span>`; };
  // Revisión v6: cada celda trae un lugar por disciplina a la vista, siempre en el orden de la leyenda (el que no tiene clase
  // queda como hueco); así todos los círculos miden lo mismo y cada disciplina se sigue con la vista.
  $('agGrid').style.setProperty('--cols', dias.length);
  $('agGrid').classList.toggle('l1', vis.length === 1);
  $('agGrid').innerHTML = horas.map((h, i) => {
    const [hh, ap] = hora12(h);
    const brk = i && horas[i - 1] < '13:00' && h >= '13:00' ? `<div class="ag-break" role="separator">${T('agenda.descanso')}</div>` : '';
    return brk + `<div class="ag-fila"><div class="ag-hora">${esc(hh)}<small>${esc(ap)}</small></div>${dias.map(d =>
      `<div class="ag-celda">${vis.map(x => HOR[x].some(c => c.d === d && c.h === h) ? circulo(x, d, h) : '<span class="ag-c hueco" aria-hidden="true"></span>').join('')}</div>`).join('')}</div>`;
  }).join('');
  $('agAyuda').textContent = ds.length > 1 ? Tt(agFiltro ? 'agenda.filtroOtraVez' : 'agenda.filtro') : '';
  $('agLeyenda').classList.toggle('filtrada', !!agFiltro);
  $('agLeyenda').innerHTML = ds.map(x => `<button type="button" class="ag-ley" data-disc="${esc(x)}" aria-pressed="${agFiltro === x}"${ds.length < 2 ? ' disabled' : ''}><i style="--bg:${colorDe(x)[0]}" aria-hidden="true"></i>${esc(x)}</button>`).join('');
  $('agLeyenda').querySelectorAll('[data-disc]').forEach(b => b.onclick = () => { agFiltro = agFiltro === b.dataset.disc ? null : b.dataset.disc; pintarAgenda();
    const otra = $('agLeyenda').querySelector(`[data-disc="${CSS.escape(b.dataset.disc)}"]`); if (otra) otra.focus(); });
}
// El botón de la ficha abre la agenda SIN elegir el elemento (se ataja en captura, como «ⓘ Condiciones»).
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-agenda]'); if (b) { e.stopPropagation(); abrirAgenda(b.dataset.agenda, b); } }, true);
$('agCerrar').onclick = () => cerrarAgenda();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('agenda').hidden) cerrarAgenda(); });

/** 2c. Cuántas clases: precio, precio por clase y la de mejor precio por clase marcada. */
const deLaCasilla = () => CAT.planes.filter(p => p.tipo === A.tipo && p.elemento === A.elemento);
const claveClases = p => (p.ilimitada ? 'ilimitada' : String(p.clases));
function textoClases(g, xs){
  if (g === 'ilimitada') return 'Ilimitadas';
  const fr = [...new Set(xs.map(p => p.frecuencia || ''))];
  return Tt('clases.opcion', { clases: g, frecuencia: fr.length === 1 ? fr[0] : '' }).trim();
}
/** Disciplinas que le faltan a un plan frente a su elemento (p. ej. un plan al que Bookings no le liga una disciplina; lectura
 *  real de Bookings. FUEGO Paquete 12 y AGUA Paquete 18 sin Barre: resuelto en Wix el 9-nov). */
const faltanDe = p => (((CAT.elementos || {})[p.elemento] || {}).incompletos || []).find(i => i.nombre === p.nombre);
const notaFaltan = xs => {
  const fs = xs.map(faltanDe).filter(Boolean); if (!fs.length) return '';
  const faltan = lista([...new Set(fs.flatMap(f => f.faltan))]);
  return `<small class="falta">${T(fs.length === xs.length ? 'clases.sinDisciplina' : 'clases.algunasSin', { faltan })}</small>`;
};
/** «$1,090 cada mes» en membresías; «$1,340 · Vigencia de 1 mes» en paquetes. */
const precioCon = p => (p.tipo === 'membresia' ? Tt('duracion.precio', { precio: pesos(p.precio), cada: cadaDe(p.cicloTexto) }) : `${pesos(p.precio)} · ${p.etiquetaDuracion}`);
function irClases(navegar = true){
  const ps = deLaCasilla(), grupos = [...new Set(ps.map(claveClases))];
  $('clasesTitulo').textContent = Tt('clases.titulo', { elemento: EL[A.elemento][1], tipo: Tt('clases.' + A.tipo) });
  $('clasesSub').textContent = Tt('clases.sub');
  interruptorRegalo($('clasesRegalo'), ps, () => irClases(false));
  // v6: el sello «El más barato por clase de esta lista» sigue al número GRANDE que se ve en cada ficha (en membresía con
  // mensual, el de la mensual; antes caía en la ficha con la semestral más barata aunque otra enseñara un número menor).
  const fichas = grupos.map(g => {
    const xs = ps.filter(p => claveClases(p) === g), d = desde(xs);
