/* --------------------------------------------------------------- promos fase 1: Oferta de Bienvenida y Dúo/Tribu Hera
   La tablet solo ENSEÑA: cuántas clases regala cada plan (`regalo`) lo pone el backend en el catálogo, y quién tiene
   derecho lo dice el servidor (Wix al verificar, o recepción con su PIN en altaBienvenidaPin); el pase lleva el derecho
   sellado y el regalo se recalcula ahí con el plan. Nada de esto cambia el precio grande ni el «desde». Fase 1: no se crean
   órdenes de bono ni cupones (recepción asigna el bono con el aviso de Slack; el grupo lo arma recepción). */
/** La tabla del regalo, con los `regalo` que el backend le puso a cada plan: [[clases, { paquete, membresia }], …]. */
function tablaRegalo(){
  const m = new Map();
  for (const p of CAT.planes) if (p.regalo > 0 && p.clases) { const f = m.get(p.clases) || {}; if (f[p.tipo] == null) f[p.tipo] = p.regalo; m.set(p.clases, f); }
  return [...m].sort((a, b) => a[0] - b[0]);
}
/** El regalo de una ficha solo si todas sus opciones regalan lo mismo (AGUA 18 junta el de 1 mes y el Serena, que no regala:

const regaloDe = xs => { const rs = [...new Set(xs.map(p => p.regalo || 0))]; return rs.length === 1 ? rs[0] : 0; };
/** v9 (Olmo, 9-nov): el «+N de regalo» ya no sale siempre: solo con el interruptor «Ver con mi regalo de bienvenida»
 *  encendido, y siempre con «solo tu primer mes» / «solo en esta compra» (es una sola vez, no cada mes). */
const fichaRegalo = n => (n > 0 && A && A.verRegalo ? `<small class="tile-regalo">${T('bienvenida.ficha', { n })}<span>${T('bienvenida.fichaNota.' + (A.tipo === 'paquete' ? 'paquete' : 'membresia'))}</span></small>` : '');
/** v9: interruptor debajo del subtítulo (apagado al entrar a cada venta). Solo si alguna opción de la lista regala y existe la

function interruptorRegalo(caja, xs, repintar){

/* --------------------------------------------------------------- regreso del sitio (#hash) */
function alRegresar(){
  const h = location.hash || '';
  if (h) history.replaceState(null, '', location.pathname + location.search);   // el recibo no se queda en la barra
  let m;
  const RD = TX.reservaDirecta;
  // Una ventana olvidada cuyo flujo ya terminó en otra pestaña: se cierra (o vuelve al check-in) SIN tocar las marcas,
  // que son del otro flujo.
  if (h === '#cerrar') {
    if (PESTANA_APARTE) { try { window.close(); } catch (_) {} }
    setTimeout(() => { location.href = KIOSCO; }, 400); return true;
  }
  // Revisión 9-nov: solo los regresos de una reserva (nunca #pagado de una venta) y nunca el bloqueo (la marca se queda).
  if (RD && ls.get(DIRECTA_KEY) && (h === '#reservada' || h === '#fin' || (/^#cancelado=/.test(h) && h !== '#cancelado=sesion-abierta'))) {
    // 'ventana' = el kiosco abrió esta pestaña aparte (Olmo 9-nov): tras el mensaje se cierra sola. Solo si de verdad es esa
    // ventana (su nombre o su opener): la pestaña del kiosco nunca intenta cerrarse. Si el navegador no deja cerrarla,
    // vuelve al check-in como siempre.
    ls.del(DIRECTA_KEY); marca.quitar();
    const par = h === '#reservada' ? RD.reservada : (m = /^#cancelado=([a-z-]{1,30})$/.exec(h)) ? (RD.motivos[m[1]] || RD.motivos.error) : RD.fin;
    fin(par[0], par[1]);
    if (PESTANA_APARTE) { clearTimeout(finTimer); finTimer = setTimeout(volverKiosco, 4000); }
    return true;
  }
  if ((m = /^#pagado=([A-Za-z0-9_.-]{20,2000})$/.exec(h))) { irApp(m[1]); return true; }
  if (h === '#fin') { marca.quitar(); fin(Tt('fin.gracias'), Tt('fin.cerrada')); return true; }
  if (h === '#reservada') { marca.quitar(); fin(Tt('fin.reservada'), Tt('fin.reservadaTexto')); return true; }
  if (h === '#cancelado=sesion-abierta') { irBloqueo(); return true; }               // la marca se queda puesta
  if ((m = /^#cancelado=([a-z-]{1,30})$/.exec(h))) {
    marca.quitar();
    const [t, x] = (TX.motivos || {})[m[1]] || TX.motivos.error; fin(t, x); return true;
  }
  return false;
}

/* --------------------------------------------------------------- QR (el mismo del kiosco) */
let qrLib = null;
function cargarQRLib(){
  if (window.QRCode) return Promise.resolve();
  if (qrLib) return qrLib;
  qrLib = new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = QR_SRC; s.integrity = QR_SRI; s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
    const to = setTimeout(() => mal(new Error('timeout')), 5000);
    s.onload = () => { clearTimeout(to); ok(); }; s.onerror = () => { clearTimeout(to); mal(new Error('qr')); };
    document.head.appendChild(s);
  }).catch(e => { qrLib = null; throw e; });
  return qrLib;
}
function qrBonito(texto){
  const tmp = document.createElement('div');
  const q = new QRCode(tmp, { text: texto, width: 64, height: 64, correctLevel: QRCode.CorrectLevel.H });
  const m = q._oQRCode, n = m.getModuleCount(), M = 2, T = n + 2 * M;
  const enOjo = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
  const centro = Math.round(n * 0.24), c0 = Math.floor((n - centro) / 2);
  const enCentro = (r, c) => r >= c0 - 1 && r <= c0 + centro && c >= c0 - 1 && c <= c0 + centro;
  let puntos = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (m.isDark(r, c) && !enOjo(r, c) && !enCentro(r, c)) puntos += `<circle cx="${c + M + .5}" cy="${r + M + .5}" r=".43"/>`;
  const ojo = (r, c) => `<rect x="${c + M + .5}" y="${r + M + .5}" width="6" height="6" rx="1.9" fill="none" stroke="#9A4215" stroke-width="1"/>
    <rect x="${c + M + 2}" y="${r + M + 2}" width="3" height="3" rx="1" fill="#9A4215"/>`;
  const lado = centro + 1, x0 = c0 + M - .5;
  return `<svg viewBox="0 0 ${T} ${T}" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
    <g fill="#424949">${puntos}</g>${ojo(0, 0)}${ojo(0, n - 7)}${ojo(n - 7, 0)}
    <rect x="${x0}" y="${x0}" width="${lado}" height="${lado}" rx="${lado * .28}" fill="#fff"/>
    <image href="${ICONO_HERA}" x="${x0 + lado * .1}" y="${x0 + lado * .1}" width="${lado * .8}" height="${lado * .8}" preserveAspectRatio="xMidYMid meet"/></svg>`;
}

['pointerdown', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, () => { ultimoToque = Date.now(); }, { passive: true }));

/* =====================================================================
   Modo demostración (solo en localhost): planes, horarios y personas inventados, sin red.
   Contraseña: demo · PIN de recepción: 1234 · correo que empiece con "ya" = clienta con cuenta (4 dígitos: 1234; pide
   su colonia); "sincel" = cuenta sin celular; cualquier otro = registro de nueva. Promos: "yamuestra" = Wix confirma su
   clase muestra de hoy (regalo en el resumen); "yaanticipo" = anticipo de $500 vivo (no cobra); el PIN de «hoy tomó su
   clase muestra» también es 1234. Prueba «gmial.com» para ver el
   «¿Quisiste decir…?». Un correo de Gmail enseña el camino «Continuar con Google»; uno que empiece con "sinventa" enseña
   el paso de la app cuando la venta no se alcanzó a confirmar.
   ===================================================================== */
let demoFallos = 0;
function demoApi(accion, datos){
  const espera = ms => new Promise(r => setTimeout(r, ms));
  const falla = (error, extra = {}) => Promise.reject(Object.assign(new Error(error), { resp: { error, ...extra } }));
  const id = n => `00000000-0000-4000-8000-${String(n).padStart(12, '0')}`;
  if (accion === 'entrar') return espera(300).then(() => datos.clave === 'demo' ? { ok: true, token: 'demo' } : falla('clave'));
  if (accion === 'altaPin') return espera(300).then(() => datos.pin == null ? { ok: true, configurado: true }
    : datos.pin === '1234' ? { ok: true, venta: 'demo-venta', vendedora: 'Recepción Demo' } : falla('pin'));
  if (accion === 'altaCatalogo') return espera(300).then(() => {
    // Catálogo DE EJEMPLO (precios inventados con la forma de los de Wix).
    const planes = []; let n = 1;
    const base = { AIRE: 100, TIERRA: 120, FUEGO: 150, AGUA: 170 }, disc = { AIRE: ['Yoga', 'Pilates Mat'], TIERRA: ['Barre', 'Yoga', 'Pilates Mat'],
      FUEGO: ['Pilates Reformer', 'Barre', 'Pilates Mat'], AGUA: ['Pilates Reformer', 'Barre', 'Yoga', 'Pilates Mat'] };
    const letraM = ['En caso de cancelar una membresía activa antes de concluir 2 ciclos de pago, se aplicará un cargo de cancelación anticipada de $500. (ejemplo)'];
    const letraP = ['Las cancelaciones fuera de tiempo y las inasistencias no son reembolsables ni canjeables. (ejemplo)'];
    for (const el of ORDEN_EL) for (const c of [4, 8, 12]) {
      const m = { planId: id(n++), nombre: `${el} - Membresia ${c} Clases`, tipo: 'membresia', elemento: el, clases: c, duracion: 'mensual', etiquetaDuracion: 'Mensual', frecuencia: 'al mes',
        precio: base[el] * c, precioPorClase: base[el], inicioLibre: true, cicloTexto: '1 mes', familia: 'mensual', disciplinas: disc[el], perks: ['Beneficio de ejemplo'], letraChica: letraM };
      const t = c >= 8 ? { planId: id(n++), nombre: `${el} - Membresía Trimestral ${c} Clases`, tipo: 'membresia', elemento: el, clases: c, duracion: 'trimestral', etiquetaDuracion: 'Trimestral', frecuencia: 'al mes',
        precio: Math.round(base[el] * c * 3 * .9), precioPorClase: Math.round(base[el] * .9), inicioLibre: true, cicloTexto: '3 meses', familia: 'trimestral', disciplinas: disc[el], perks: ['Beneficio de ejemplo'], letraChica: letraM } : null;
      const p = { planId: id(n++), nombre: `${el} - Paquete ${c} Clases`, tipo: 'paquete', elemento: el, clases: c, duracion: 'vigencia-1-mes', etiquetaDuracion: 'Vigencia de 1 mes', frecuencia: '',
        precio: Math.round(base[el] * c * 1.2), precioPorClase: Math.round(base[el] * 1.2), inicioLibre: false, vigenciaTexto: '1 mes', familia: 'paquete', disciplinas: disc[el], perks: ['Pago único (ejemplo)'], letraChica: letraP };
      const cmp = (pq, mm, ciclos) => ({ porClasePaquete: pq.precioPorClase, porClaseMembresia: mm.precioPorClase, ahorroClase: pq.precioPorClase - mm.precioPorClase,
        ahorroMes: Math.round((pq.precioPorClase - mm.precioPorClase) * c), ahorroAnio: Math.round((pq.precioPorClase - mm.precioPorClase) * c * 12), ciclosAnio: ciclos, conMesAnio: true,
        cent: { porClasePaquete: pq.precioPorClase * 100, porClaseMembresia: mm.precioPorClase * 100, ahorroClase: (pq.precioPorClase - mm.precioPorClase) * 100, clases: c,
          ahorroCobro: (pq.precioPorClase - mm.precioPorClase) * 100 * c, ahorroAnio: (pq.precioPorClase - mm.precioPorClase) * 100 * c * 12 } });
      p.equivalente = { planId: m.planId, nombre: m.nombre, clases: c, frecuencia: 'al mes', precio: m.precio, ...cmp(p, m, 12) };
      m.equivalente = { planId: p.planId, nombre: p.nombre, clases: c, vigenciaTexto: '1 mes', precio: p.precio, ...cmp(p, m, 12) };
      if (t) t.equivalente = { planId: p.planId, nombre: p.nombre, clases: c, vigenciaTexto: '1 mes', precio: p.precio, ...cmp(p, t, 4) };
      // v4: comparaciones de la trimestral contra la mensual y el paquete (misma fórmula que alta.compararLargo).
      const vs = o => { const pp = t.precio / (c * 3), po = o.precio / c, si = pp < po;
        return { planId: o.planId, nombre: o.nombre, precio: o.precio, porClase: Math.round(pp), porClaseOtro: Math.round(po), veces: 3, masBarato: si,
          ahorroClase: si ? Math.round(po) - Math.round(pp) : null, ahorroPeriodo: si ? Math.round(o.precio * 3 - t.precio) : null }; };
      if (t) t.largo = { mensual: vs(m), paquete: vs(p), compromiso: '6 meses' };
      m.regalo = { 4: 2, 8: 3, 12: 4 }[c]; p.regalo = { 4: 1, 8: 2, 12: 3 }[c];   // promos: lo que pondría regaloBienvenida
      planes.push(m, p); if (t) planes.push(t);
    }
    const elementos = Object.fromEntries(ORDEN_EL.map(el => [el, { disciplinas: disc[el], incompletos: [], fuente: 'bookings' }]));
    const beneficios = { membresia: { todas: ['Beneficio de ejemplo para todas'], grupos: [{ familias: ['mensual'], perks: ['Beneficio de ejemplo mensual'] }, { familias: ['trimestral'], perks: ['Beneficio de ejemplo trimestral'] }],
      cancelacion: letraM[0], variantesCancelacion: 1 }, paquete: { todas: ['Pago único (ejemplo)'], vigencias: ['1 mes'] } };
    const largos = planes.filter(x => x.largo), barato = xs => xs.length > 0 && xs.every(x => x.largo.mensual.masBarato && x.largo.paquete.masBarato);
    const largo = { n: largos.length, masBarato: barato(largos), elementos: Object.fromEntries(ORDEN_EL.map(el => { const xs = largos.filter(x => x.elemento === el); return [el, { n: xs.length, masBarato: barato(xs) }]; })) };
    // Con ?prueba en la URL, el demo enseña también la sección del plan de prueba (?prueba=recurrente: el de cobro cada mes).
    const qp = new URLSearchParams(location.search).get('prueba');
    const prueba = qp === 'recurrente' ? { planId: id(999), nombre: 'PRUEBA - Cobro con tarjeta (ejemplo)', prueba: true, recurrente: true, tipo: 'membresia', elemento: null, clases: null,
      duracion: 'mensual', etiquetaDuracion: 'Mensual', precio: 10, precioPorClase: null, frecuencia: '', inicioLibre: false, cicloTexto: '1 mes', familia: 'mensual', disciplinas: [], perks: [], letraChica: [] }
      : qp != null ? { planId: id(999), nombre: 'PRUEBA alta mostrador (ejemplo)', prueba: true, tipo: 'paquete', elemento: null, clases: 1,
      duracion: 'vigencia-1-semana', etiquetaDuracion: 'Vigencia de 1 semana', precio: 10, precioPorClase: 10, frecuencia: '', inicioLibre: false, vigenciaTexto: '1 semana', familia: 'paquete', disciplinas: [], perks: [], letraChica: [] } : null;
    return { ok: true, planes, elementos, beneficios, largo, prueba, omitidos: [], vendedora: 'Recepción Demo' };
  });
  if (accion === 'altaHorarios') {   // v6: una semana de ejemplo (formato de altaHorarios: d = día 0-6, h = 'HH:mm')
    const sem = (dias, horas) => dias.flatMap(d => horas.map(h => ({ d, h })));
    return espera(500).then(() => ({ ok: true, disciplinas: [
      { nombre: 'Pilates Reformer', semana: sem([1, 2, 3, 4, 5], ['07:00', '08:00', '18:30', '19:30']).concat(sem([6], ['09:00'])) },
      { nombre: 'Barre', semana: sem([1, 3, 5], ['08:00', '19:30']) }, { nombre: 'Yoga', semana: sem([2, 4], ['07:00', '18:30']).concat(sem([6], ['10:00'])) },
      { nombre: 'Pilates Mat', semana: sem([2, 4], ['10:00']) }] }));
  }
  // v3: correo que empiece con "ya" = ya tiene cuenta (celular que termina en 1234; pide colonia); "sincel" = cuenta sin
  // celular en Wix; cualquier otro = nueva (registro). En el registro, un celular que termine en 0000 hace como si fuera
  // de otro contacto (en la tablet no se nota: solo marca el aviso de Slack).
  if (accion === 'altaBuscar') return espera(400).then(() => {
    const e = String(datos.email);
    return /^(ya|sincel)/.test(e) ? { ok: true, existe: true, reto: 'demo-reto|' + e, ...(/^sincel/.test(e) ? { sinTelefono: true } : {}) } : { ok: true, existe: false, reto: 'demo-nueva|' + e };
  });
  if (accion === 'altaVerificar') return espera(400).then(() => {
    demoFallos = (demoFallos || 0);
    if (datos.ult4 !== '1234') { demoFallos++; return falla('verificacion', { segundos: 2, ...(demoFallos >= 2 ? { agotado: true } : {}) }); }
    demoFallos = 0;
    // Promos: «yamuestra…» = Wix confirma su clase muestra de hoy; «yaanticipo…» = tiene el anticipo de $500 vivo.
    const e = String(datos.reto || '').split('|')[1] || '';
    const bienvenida = { derecho: /^yamuestra/.test(e), por: /^yamuestra/.test(e) ? 'wix' : null, bloqueo: /^yaanticipo/.test(e) };
    if (datos.previo) return { ok: true, verif: 'demo-verif', existe: true, nueva: true, nombre: 'Clienta D.', planes: [], pideColonia: false, bienvenida };
    return { ok: true, verif: 'demo-verif', existe: true, nombre: 'Clienta D.', planes: [{ nombre: 'TIERRA - Paquete 4 Clases', estado: 'activa' }], pideColonia: true, bienvenida };
  });
  if (accion === 'altaRegistro') return espera(500).then(() => ({ ok: true, verif: 'demo-verif', existe: false, nombre: `${datos.nombre} ${datos.apellido}`, planes: [], bienvenida: { derecho: false, por: null, bloqueo: false } }));
  // Promos: el PIN de recepción para «hoy tomó su clase muestra» (el mismo del demo: 1234).
  if (accion === 'altaBienvenidaPin') return espera(400).then(() => datos.pin === '1234' ? { ok: true, verif: 'demo-verif', bienvenida: { derecho: true, por: 'recepcion', bloqueo: false, quien: 'Recepción Demo' } } : falla('pin'));
  if (accion === 'altaColonia') return espera(300).then(() => ({ ok: true, guardada: true, verif: 'demo-verif' }));
  if (accion === 'altaPase') return espera(500).then(() => ({ ok: true, pase: 'demo', url: 'demo/?alta=demo', base: SITIO }));
  if (accion === 'altaApp') return espera(300).then(() => { const c = demoUltimoCorreo || ('clienta.demo' + '@' + 'gmail.com');
    return { ok: true, correo: c, google: /@(gmail|googlemail)\.com$/.test(c), registrada: !/^sinventa/.test(c), ...(demoPruebaRec ? { pruebaRecurrente: true } : {}) }; });
  if (accion === 'altaCorreo') return espera(500).then(() => ({ ok: true }));
  return falla('accion');
}
