<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-VDKjyxm02wGS6vjEoXG8yxS+KT6bg9hjzqGZk2AE7Qg=' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https://static.wixstatic.com data:; connect-src https://www.herazenter.com 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#EFE7DE">
<link rel="icon" type="image/png" sizes="32x32" href="https://static.wixstatic.com/media/9d6afa_e930e021d3564d24bc04bdc3e4c172f3~mv2.png/v1/fill/w_32,h_32/favicon.png">
<title>Alta en mostrador · Hera Zenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --terracota:#9A4215; --carbon:#424949; --texto:#2B2B2B; --gris:#6F6F6F;
  --arena:#EFE7DE; --arena-suave:#F7F2EC; --crema:#E8DCD0; --pizarra:#788991;
  --ok:#4F7A5A; --alerta:#B5651D;
  --fuego:#E8613C; --agua:#3C8FD6; --aire:#6F9CCB; --tierra-el:#7A6A4F;
  --radio:18px; --sombra:0 1px 2px rgba(66,73,73,.08),0 6px 24px rgba(66,73,73,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--arena);color:var(--texto);font-family:Jost,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3,.num{font-family:Poppins,Helvetica,Arial,sans-serif;font-weight:600;color:var(--carbon);letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;font-size:22px;-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:16px;padding:18px 24px 6px;width:100%;max-width:1080px;margin:0 auto}
.top img{height:54px}
.top .titulo{font-family:Poppins;font-weight:600;font-size:18px;color:var(--carbon)}
.top .titulo small{display:block;font-family:Jost;font-weight:400;font-size:15px;color:var(--gris)}
.cancelar{margin-left:auto;border:1.5px solid var(--crema);background:#fff;border-radius:999px;padding:12px 22px;font-size:18px;color:var(--carbon)}
.cancelar:active{background:var(--arena-suave)}

main{flex:1;padding:12px 24px 28px;display:flex;flex-direction:column;width:100%;max-width:880px;margin:0 auto}
.vista{display:none;flex-direction:column;align-items:center;gap:20px;animation:entra .2s ease-out;width:100%;text-align:center}
.vista.activa{display:flex}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vista h1{font-size:34px;line-height:1.15;margin-top:2vh}
.vista > p, .sub{font-size:19px;color:var(--gris);max-width:640px}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;width:100%}
.op{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:24px 22px;min-height:96px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;font-size:23px;font-weight:500;color:var(--carbon);border:2px solid transparent}
.op small{font-size:16px;font-weight:400;color:var(--gris)}
.op:active{transform:scale(.98);background:var(--arena-suave)}
.op .el{width:56px;height:56px}
.campo{width:min(560px,100%);border:1.5px solid var(--crema);background:#fff;border-radius:15px;padding:18px 20px;outline:0;text-align:center}
.campo:focus{border-color:var(--pizarra)}
.error{color:var(--alerta);font-size:18px;min-height:24px;max-width:640px}
.btn{border-radius:15px;padding:20px 28px;font-size:21px;font-weight:500;text-align:center;min-height:64px;min-width:260px}
.btn.pri{background:var(--terracota);color:#fff}
.btn.sec{background:#fff;color:var(--terracota);border:1.5px solid var(--terracota)}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.55}
.atras{align-self:flex-start;font-size:18px;color:var(--gris);padding:8px 4px}
.tarjeta{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:20px 24px;width:min(640px,100%);text-align:left}
.tarjeta .fila{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--arena);font-size:19px}
.tarjeta .fila:first-child{border-top:0}
.tarjeta .fila span:first-child{color:var(--gris)}
.tarjeta .fila b{font-weight:500;text-align:right}
.precio{font-family:Poppins;font-weight:600;font-size:40px;color:var(--carbon)}
.nota{font-size:16px;color:var(--gris);max-width:600px}
.quien{background:var(--arena-suave);border:1px solid var(--crema);border-radius:14px;padding:12px 18px;font-size:18px;color:var(--carbon);max-width:600px}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(360px,100%)}
.teclado button{background:#fff;border-radius:16px;font-family:Poppins;font-weight:600;font-size:28px;color:var(--carbon);min-height:68px;box-shadow:var(--sombra)}
.teclado button:active{background:var(--crema)}
.puntos{display:flex;gap:14px;justify-content:center}
.puntos i{width:18px;height:18px;border-radius:50%;border:2px solid var(--carbon)}
.puntos i.lleno{background:var(--carbon)}
.qr-grande{width:280px;height:280px;background:#fff;border-radius:28px;padding:14px;box-shadow:0 6px 24px rgba(154,66,21,.18);display:grid;place-items:center}
.qr-grande svg{width:100%;height:100%;display:block}
.pasos{text-align:left;font-size:19px;color:var(--carbon);line-height:1.55;padding-left:26px;max-width:560px}
.pasos b{color:var(--terracota)}
.ok-msg{color:var(--ok);font-size:18px;min-height:24px}
.pregunta{font-size:24px;margin-top:6px}
.fila-btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.cargando{color:var(--gris);font-size:18px}
.giro{width:46px;height:46px;border-radius:50%;border:4px solid var(--crema);border-top-color:var(--terracota);animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.cuenta-atras{font-size:17px;color:var(--gris)}
.cuenta-atras b{color:var(--carbon);font-family:Poppins}
.bloqueo{background:#9A3B2E;color:#fff;border-radius:var(--radio);padding:28px 24px;max-width:640px}
.bloqueo h1{color:#fff}
.bloqueo p{color:#fff;font-size:19px;margin-top:10px}
.correo-grande{font-family:Poppins;font-weight:600;font-size:24px;color:var(--carbon);word-break:break-all}
.demo{position:fixed;right:12px;bottom:12px;font-size:12px;color:var(--gris);background:var(--arena-suave);border:1px dashed var(--crema);padding:6px 10px;border-radius:8px}
@media (max-width:700px){ .top{padding:12px 16px 4px} main{padding:8px 16px 20px} .vista h1{font-size:27px} .btn{min-width:0;width:100%} }
/* v2: pantallas explicativas (letra grande, frases cortas) */
.planes2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;width:100%;text-align:left}
.carta{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:24px 24px 20px;display:flex;flex-direction:column;gap:12px;border:2px solid transparent}
.carta h2{font-size:28px;display:flex;align-items:center;gap:12px}
.carta .lema{font-size:20px;color:var(--terracota);font-weight:500}
.carta ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:19px;line-height:1.35;color:var(--texto)}
.carta ul li{padding-left:26px;position:relative}
.carta ul li::before{content:'✓';position:absolute;left:0;color:var(--ok);font-weight:600}
.carta .grupo{font-size:16px;color:var(--gris);margin-top:4px}
.carta .chica{font-size:15px;color:var(--gris);border-top:1px solid var(--arena);padding-top:10px;line-height:1.4}
.carta .btn{margin-top:auto;width:100%}
.carta.elegible{cursor:pointer}
.carta.elegible:active{transform:scale(.99);background:var(--arena-suave)}
.carta .horas{font-size:16px;color:var(--carbon);line-height:1.5}
.carta .horas b{font-weight:500}
.op .mejor,.mejor{display:inline-block;background:#F5E7C8;color:#7A5410;border-radius:999px;padding:3px 10px;font-size:14px;font-weight:500;margin-top:4px}
.op.destacada{border-color:#E2C27A}
.op .ppc{font-size:18px;color:var(--carbon);font-weight:500}
.op small.falta{color:var(--alerta);font-size:15px}
.empuje{background:#FFF7E8;border:2px solid #E2C27A;border-radius:var(--radio);padding:24px;max-width:640px;text-align:left;display:flex;flex-direction:column;gap:12px}
.empuje p{font-size:21px;line-height:1.4;color:var(--texto)}
.empuje .chica{font-size:15px;color:var(--gris)}
.refuerzo{background:#EEF5EF;border:1.5px solid #B9D3BF;border-radius:14px;padding:14px 18px;font-size:18px;line-height:1.4;max-width:640px;text-align:left;color:var(--texto)}
.letra{width:min(640px,100%);text-align:left;font-size:15px;color:var(--gris);line-height:1.45}
.letra b{color:var(--carbon);font-weight:500}
.letra ul{padding-left:20px;margin-top:4px}
.correo-app{background:#fff;border:2px solid var(--terracota);border-radius:16px;padding:14px 18px;max-width:640px;width:100%}
.correo-app small{display:block;font-size:16px;color:var(--gris)}
.correo-app .aviso{font-size:17px;color:var(--terracota);font-weight:500;margin-top:6px}
.app-fila{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.pin-puntos{display:flex;gap:14px;justify-content:center;min-height:22px}
.pin-puntos i{width:18px;height:18px;border-radius:50%;background:var(--carbon)}
.volver-k{font-size:17px;color:var(--gris);text-decoration:underline;padding:10px}
/* v3: correo en grande, sugerencia y registro */
.correo-grande.grande{font-size:30px}
.sugerencia{background:#FFF7E8;border:2px solid #E2C27A;border-radius:16px;padding:16px 20px;max-width:640px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.sugerencia p{font-size:21px;color:var(--texto)}
.form{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.etiqueta{font-size:18px;color:var(--carbon);margin-top:6px}
.cumple{display:grid;grid-template-columns:1fr 1.6fr 1.3fr;gap:10px;width:min(560px,100%)}
.cumple .campo{width:100%;padding:16px 10px;font-size:20px;-webkit-appearance:none;appearance:none}
.dato{display:flex;flex-direction:column;gap:4px;width:min(560px,100%);text-align:left}
.dato > span{font-size:15px;color:var(--gris);padding-left:6px}
.dato .campo{width:100%}
.dato small{font-size:16px;color:var(--carbon);padding-left:6px;min-height:20px}
.res-correo{display:flex;flex-direction:column;gap:6px;align-items:center}
.res-correo .btn{min-height:48px;padding:10px 22px;font-size:18px;min-width:0}
/* v4: planes de largo plazo y plan de prueba */
.extra{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}
.largo-el{display:flex;align-items:center;gap:10px;font-size:24px;align-self:flex-start;margin-top:8px}
.carta p{font-size:18px;line-height:1.4;color:var(--texto)}
.carta.prueba{border:2px dashed var(--alerta);background:#FFF7E8;width:min(640px,100%)}
.carta.prueba .grupo{color:var(--alerta);font-weight:500;font-size:18px}
.aviso-cancelar{background:#FDECEC;border:2.5px solid #B42318;border-radius:14px;padding:12px 18px;font-size:19px;font-weight:600;color:#B42318;max-width:640px;margin:0 auto 10px}
.aviso-prueba{background:#FFF7E8;border:2px dashed var(--alerta);border-radius:14px;padding:12px 18px;font-size:18px;color:var(--alerta);max-width:640px}
</style>
</head>
<body>

<header class="top">
  <img src="https://static.wixstatic.com/media/9d6afa_e930e021d3564d24bc04bdc3e4c172f3~mv2.png/v1/fill/w_140,h_140/icono.png" alt="Hera Zenter">
  <div class="titulo">Alta en mostrador<small id="paso"></small></div>
  <button class="cancelar" id="cancelar" hidden>Cancelar</button>
</header>

<main>
  <!-- CONTRASEÑA DE LA TABLET (la misma del kiosco: comparte su token) -->
  <section class="vista" id="vClave">
    <h1>Alta en mostrador</h1>
    <p>Esta pantalla es solo para la tablet de recepción.</p>
    <input class="campo" id="clave" type="password" placeholder="Contraseña" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="error" id="claveError"></div>
    <button class="btn pri" id="claveOk">Entrar</button>
  </section>

  <section class="vista" id="vCargando"><div class="giro"></div><p class="cargando" id="cargandoTxt">Cargando…</p></section>

  <!-- 0. PIN DE LA RECEPCIONISTA (la venta queda a su nombre; el PIN nunca se guarda) -->
  <section class="vista" id="vPin">
    <h1 id="pinTitulo"></h1>
    <p id="pinTexto"></p>
    <div class="pin-puntos" id="pinPuntos"></div>
    <div class="teclado" id="pinTeclado"></div>
    <div class="error" id="pinError"></div>
    <p class="nota" id="pinNota"></p>
    <button class="volver-k" id="pinVolver"></button>
  </section>

  <!-- 2. CORREO (después de elegir el plan) -->
  <section class="vista" id="vCorreo">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 data-tx="correo.titulo"></h1>
    <p data-tx="correo.texto"></p>
    <input class="campo" id="correo" type="email" inputmode="email" data-ph="correo.placeholder" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
    <div class="error" id="correoError"></div>
    <button class="btn pri" id="correoOk" data-tx="correo.seguir"></button>
  </section>

  <!-- 2b. ¿ESTÁ BIEN ESCRITO? (en grande, con sugerencia si parece error de dedo) -->
  <section class="vista" id="vConfirma">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 data-tx="confirma.pregunta"></h1>
    <div class="correo-app"><div class="correo-grande grande" id="confCorreo"></div><div class="aviso" data-tx="confirma.app"></div></div>
    <div class="sugerencia" id="confSug" hidden><p id="confSugTxt"></p><button class="btn pri" id="confUsar"></button></div>
    <div class="error" id="confError"></div>
    <div class="fila-btns">
      <button class="btn pri" id="confSi" data-tx="confirma.si"></button>
      <button class="btn sec" id="confCorregir" data-tx="confirma.corregir"></button>
    </div>
  </section>

  <!-- 2c. YA TIENE CUENTA: los 4 últimos de su celular -->
  <section class="vista" id="vCel">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 data-tx="cel.titulo"></h1>
    <p id="celTexto" data-tx="cel.texto"></p>
    <div class="puntos" id="puntos"><i></i><i></i><i></i><i></i></div>
    <div class="teclado" id="teclado"></div>
    <div class="error" id="celError"></div>
    <p class="nota" id="celNota" data-tx="cel.nota"></p>
    <p class="nota" id="celRecepcion" data-tx="cel.recepcion" hidden></p>
    <button class="btn sec" id="celOtroCorreo" data-tx="cel.otroCorreo"></button>
  </section>

  <!-- 2d. YA TIENE CUENTA: hola, sus planes y (si falta) su colonia -->
  <section class="vista" id="vHola">
    <h1 id="holaTitulo"></h1>
    <div class="quien" id="quien"></div>
    <div id="holaColoniaCaja" hidden style="display:flex;flex-direction:column;gap:10px;align-items:center;width:100%">
      <label for="holaColonia" style="font-size:20px;color:var(--carbon)" data-tx="hola.colonia"></label>
      <input class="campo" id="holaColonia" autocomplete="off" autocapitalize="words" spellcheck="false" data-ph="registro.colonia" maxlength="60">
    </div>
    <div class="error" id="holaError"></div>
    <div class="fila-btns">
      <button class="btn pri" id="holaOk"></button>
      <button class="btn sec" id="holaSaltar" hidden data-tx="hola.saltar"></button>
    </div>
  </section>

  <!-- 2e. NUEVA: registro desde cero -->
  <section class="vista" id="vRegistro">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 data-tx="registro.titulo"></h1>
    <p data-tx="registro.sub"></p>
    <div class="correo-app"><small data-tx="registro.correo"></small><div class="correo-grande" id="regCorreo"></div></div>
    <div class="form">
      <!-- Etiquetas visibles (revisión v3): al escribir, el texto guía desaparece y en tablet no se sabía qué campo era. -->
      <label class="dato"><span data-tx="registro.nombre"></span><input class="campo" id="regNombre" data-ph="registro.nombre" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="60"></label>
      <label class="dato"><span data-tx="registro.apellido"></span><input class="campo" id="regApellido" data-ph="registro.apellido" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="60"></label>
      <!-- Sin recortar: «+52 33 1234 5678» (16 caracteres, así lo pega iOS) se normaliza, nunca se trunca. -->
      <label class="dato"><span data-tx="registro.celular"></span><input class="campo" id="regCelular" type="tel" inputmode="numeric" data-ph="registro.celularEjemplo" autocomplete="off" maxlength="24"><small id="regCelVes"></small></label>
      <label class="dato"><span data-tx="registro.colonia"></span><input class="campo" id="regColonia" data-ph="registro.coloniaEjemplo" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="60"></label>
      <label class="etiqueta" data-tx="registro.cumple"></label>
      <div class="cumple">
        <select class="campo" id="regDia" aria-label="Día"></select>
        <select class="campo" id="regMes" aria-label="Mes"></select>
        <input class="campo" id="regAnio" type="tel" inputmode="numeric" data-ph="registro.anio" autocomplete="off" maxlength="4">
      </div>
    </div>
    <div class="error" id="regError"></div>
    <button class="btn pri" id="regOk" data-tx="registro.boton"></button>
  </section>

  <!-- 2a. MEMBRESÍA O PAQUETE (qué es cada uno, beneficios reales y letra chica) -->
  <section class="vista" id="vTipo">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="tipoTitulo"></h1>
    <p id="tipoSub"></p>
    <div class="planes2" id="tipoLista"></div>
    <div class="extra" id="tipoExtra"></div>
  </section>

  <!-- 2b. ELEMENTO (disciplinas y horarios reales) -->
  <section class="vista" id="vElemento">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="elTitulo"></h1>
    <p id="elSub"></p>
    <div class="planes2" id="elLista"></div>
  </section>

  <!-- 2c. CLASES (precio y precio por clase) -->
  <section class="vista" id="vClases">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="clasesTitulo"></h1>
    <p id="clasesSub"></p>
    <div class="ops" id="clasesLista"></div>
    <div class="extra" id="clasesExtra"></div>
  </section>

  <!-- v4: PLANES DE LARGO PLAZO (trimestrales y semestrales, con su ahorro real contra la mensual y el paquete) -->
  <section class="vista" id="vLargo">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="largoTitulo"></h1>
    <p id="largoSub"></p>
    <p class="nota" id="largoLetra"></p>
    <div class="extra" id="largoLista"></div>
  </section>

  <!-- 2d. DURACIÓN -->
  <section class="vista" id="vDuracion">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="durTitulo"></h1>
    <p id="durSub"></p>
    <div class="ops" id="durLista"></div>
  </section>

  <!-- 2e. ¿Y SI MEJOR MEMBRESÍA? (solo si eligió paquete y la membresía sale más barata) -->
  <section class="vista" id="vEmpuje">
    <button class="atras" data-atras>‹ Atrás</button>
    <h1 id="empTitulo"></h1>
    <div class="empuje" id="empCarta"></div>
    <div class="fila-btns">
      <button class="btn pri" id="empCambiar"></button>
      <button class="btn sec" id="empSeguir"></button>
    </div>

const DOMINIOS_REALES = ['mail.com', 'email.com', 'gmx.com', 'gmx.net', 'ymail.com', 'mac.com', 'yahoo.es', 'hotmail.fr', 'hotmail.it', 'hotmail.co.uk', 'outlook.fr', 'live.com.ar', 'live.cl'];
/* Errores comunes que están lejos por letras pero son claros. */

  'outlook.mx': 'outlook.com', 'icloud.mx': 'icloud.com', 'icloud.com.mx': 'icloud.com',

/** Distancia de edición con transposición (gmial ↔ gmail cuenta 1). */
function distanciaCorreo(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    const c = a[i - 1] === b[j - 1] ? 0 : 1;
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}

/** «ana arroba gmial.com» → «ana arroba gmail.com». null si se ve bien (o no se parece a ningún dominio común). */
function sugerirCorreo(email) {
  const m = /^([^@\s]+)@([a-z0-9.-]+)$/.exec(String(email || '').trim().toLowerCase());
  if (!m) return null;
  const usuario = m[1], dom = m[2].replace(/\.+$/, '');
  if (DOMINIOS_CORREO.includes(dom) || DOMINIOS_REALES.includes(dom)) return null;
  if (DOMINIOS_FIJOS[dom]) return usuario + '@' + DOMINIOS_FIJOS[dom];
  if (!dom.includes('.')) {                                   // «ana@gmail» → falta el .com
    const x = DOMINIOS_CORREO.find(y => distanciaCorreo(dom, y.split('.')[0]) <= (dom.length >= 5 ? 1 : 0));
    return x ? usuario + '@' + x : null;
  }
  let mejor = null, dm = Infinity;
  for (const x of DOMINIOS_CORREO) { const k = distanciaCorreo(dom, x); if (k < dm) { dm = k; mejor = x; } }
  return dm > 0 && dm <= (dom.length >= 9 ? 2 : 1) ? usuario + '@' + mejor : null;
}

const VISTAS_CORREO = ['vCorreo', 'vConfirma', 'vCel', 'vRegistro', 'vHola'];
const sinCorreoEnPila = () => { pila = pila.filter(v => !VISTAS_CORREO.includes(v)); };
function irCorreo(){
  A.reto = null; A.ult4 = ''; A.verif = null; A.fallosCel = 0; A.correoConfirmado = false; $('correoError').textContent = '';
  const actual = (document.querySelector('.vista.activa') || {}).id;

}
/** Ya eligió plan: sin identificarse (4 dígitos o registro), a dar su correo; ya identificada, al resumen. */

/* --------------------------------------------------------------- 2. correo → ¿está bien escrito? (v3: sin código por correo) */
/** El mensaje de error va a la caja .error de la pantalla que se ve. */
function errorAqui(msg){ const v = document.querySelector('.vista.activa'); const e = v && v.querySelector('.error'); if (e) e.textContent = msg; }
function correoOk(){
  const email = $('correo').value.trim().toLowerCase();
  const formato = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email), sug = sugerirCorreo(email);
  if (!formato && !sug) { $('correoError').textContent = Tt('correo.revisa'); return; }
  if (email !== A.email) { A.reto = null; A.fallosCel = 0; A.ult4 = ''; }
  A.email = email; A.sugerencia = sug; $('correoError').textContent = '';
  // En grande, para que lo revise: «¿Está bien escrito? Con este entrarás a la app». Si parece error de dedo, la sugerencia.
  $('confCorreo').textContent = email; $('confError').textContent = '';
  $('confSug').hidden = !sug;
  if (sug) { $('confSugTxt').innerHTML = T('confirma.quisiste', { sugerencia: sug }); $('confUsar').textContent = Tt('confirma.usar', { sugerencia: sug }); }
  $('confSi').hidden = !formato;                       // sin formato válido solo queda usar la sugerencia o corregir
  $('confSi').className = 'btn ' + (sug ? 'sec' : 'pri');   // con sugerencia, el botón fuerte es «Sí, usar …»
  ir('vConfirma');
}
$('correoOk').onclick = correoOk;
$('correo').addEventListener('keydown', e => { if (e.key === 'Enter') correoOk(); });
$('confSi').onclick = () => buscarCorreo();
$('confUsar').onclick = () => { A.email = A.sugerencia; $('correo').value = A.email; A.sugerencia = null; buscarCorreo(); };
$('confCorregir').onclick = () => { ir('vCorreo', { apilar: false }); setTimeout(() => $('correo').focus(), 80); };

/** Ya confirmó su correo: ¿existe en Wix? Sí → 4 dígitos; no → registro. También se usa para volver a identificarla. */
let buscando = false;
async function buscarCorreo(){
  if (buscando || !A.email) return;
  buscando = true; $('confSi').disabled = true; $('confUsar').disabled = true;
  try {
    const j = await api('altaBuscar', { email: A.email });
    A.correoConfirmado = true; A.reto = j.reto;
    if (!j.existe) { irRegistro(); return; }
    if (j.sinContacto) { irCel(); celSinSalida(Tt('cel.sinContacto')); return; }
    if (j.sinTelefono) { irCel(); celSinSalida(Tt('cel.sinTelefono')); return; }
    irCel();
  } catch (e) {
    if (e.auth) return;
    const er = errDe(e);
    errorAqui(TX.correo.errores[er] ? Tt('correo.errores.' + er) : Tt('correo.errores.red'));
  } finally { buscando = false; $('confSi').disabled = false; $('confUsar').disabled = false; }
}

/* --------------------------------------------------------------- 2c. ya tiene cuenta: 4 últimos de su celular */
$('teclado').innerHTML = ['1','2','3','4','5','6','7','8','9','⌫','0','✓'].map(k => `<button data-k="${k}" aria-label="${k === '⌫' ? 'Borrar' : k === '✓' ? 'Listo' : k}">${k}</button>`).join('');
$('teclado').querySelectorAll('button').forEach(b => b.onclick = () => {
  const k = b.dataset.k;
  if (k === '⌫') A.ult4 = A.ult4.slice(0, -1);
  else if (k === '✓') { if (A.ult4.length === 4) verificarCel(); return; }
  else if (A.ult4.length < 4) A.ult4 += k;
  pintarPuntos();
  if (A.ult4.length === 4) setTimeout(verificarCel, 180);
});
function pintarPuntos(){ $('puntos').querySelectorAll('i').forEach((x, i) => x.classList.toggle('lleno', i < (A ? A.ult4.length : 0))); }
function irCel(){
  A.ult4 = ''; pintarPuntos(); $('celError').textContent = '';
  $('teclado').hidden = false; $('puntos').hidden = false; $('celTexto').hidden = false; $('celNota').hidden = false; $('celRecepcion').hidden = true;
  ir('vCel');
}
/** Tras 2 fallos (o sin celular en Wix): ya no se teclea más aquí; queda «Usar otro correo» (o pasar con recepción).
 *  Se esconde lo que pedía teclear (contradecía al mensaje rojo) y sale una línea para recepción. */
function celSinSalida(msg){ A.ult4 = ''; pintarPuntos(); ['teclado','puntos','celTexto','celNota'].forEach(id => { $(id).hidden = true; });
  $('celRecepcion').hidden = false; $('celError').textContent = msg; }
$('celOtroCorreo').onclick = () => irCorreo();
let verificando = false;
async function verificarCel(){
  if (verificando || !A.reto || A.ult4.length !== 4) return;
  verificando = true; $('celError').textContent = '';
  const ult4 = A.ult4;
  try {
    // `previo`: el «verif» que se venció (si se registró aquí, sus notas para recepción no se pierden).
    const j = await api('altaVerificar', { reto: A.reto, ult4, ...(A.verifViejo ? { previo: A.verifViejo } : {}) });
    A.verif = j.verif; A.existe = !j.nueva; A.nombreV = j.nombre || ''; A.planes = j.planes || []; A.pideColonia = !!j.pideColonia;
    A.reto = null; A.ult4 = ''; A.verifViejo = null;
    sinCorreoEnPila();                                 // «Atrás» desde el resumen regresa al plan, no al correo
    if (j.nueva) irResumen(); else irHola();           // recién registrada: de regreso a su resumen
  } catch (e) {
    if (e.auth) return;
    const er = errDe(e), r = e.resp || {};
    A.ult4 = ''; pintarPuntos();
    if (er === 'verificacion') {
      A.fallosCel++;
      if (r.agotado || A.fallosCel >= 2) celSinSalida(Tt('cel.agotado'));
      else $('celError').textContent = Tt('cel.malo') + ' ' + Tt('cel.queda1') + (r.segundos ? ' ' + Tt('cel.espera', { segundos: r.segundos }) : '');
    } else if (er === 'espera') $('celError').textContent = Tt('cel.espera', { segundos: r.segundos || 2 });
    else if (er === 'agotado') celSinSalida(Tt('cel.agotado'));
    else if (er === 'venta-tope') celSinSalida(Tt('cel.ventaTope'));
    else if (er === 'no-encontrada') celSinSalida(Tt('cel.sinContacto'));
    else if (er === 'sin-telefono') celSinSalida(Tt('cel.sinTelefono'));
    else if (er === 'ocupado') celSinSalida(Tt('cel.ocupado', { minutos: r.minutos || 15 }));
    else if (['reto', 'usado', 'cambio'].includes(er)) { A.reto = null; celSinSalida(Tt(er === 'cambio' ? 'cel.cambio' : 'cel.reto')); }
    else $('celError').textContent = Tt('cel.red');
  } finally { verificando = false; }
}

/** «¡Hola de nuevo!», sus planes vivos y, si su contacto no tiene Colonia, se le pide una vez (con «Saltar»). */

/* --------------------------------------------------------------- 2e. nueva: registro desde cero */
/** Días del mes elegido (febrero: 29, por si no da año). Sin mes, 31. Si el día elegido ya no cabe, se borra. */
const DIAS_MES = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function pintarDias(){
  const m = +$('regMes').value, a = +$('regAnio').value, antes = $('regDia').value;
  let n = m ? DIAS_MES[m - 1] : 31;
  if (m === 2 && a >= 1900 && !((a % 4 === 0 && a % 100 !== 0) || a % 400 === 0)) n = 28;
  $('regDia').innerHTML = `<option value="">${esc(Tt('registro.dia'))}</option>` + Array.from({ length: n }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
  $('regDia').value = antes && +antes <= n ? antes : '';
}
$('regMes').innerHTML = `<option value="">${esc(Tt('registro.mes'))}</option>` + (TX.registro.meses || []).map((m, i) => `<option value="${i + 1}">${esc(m)}</option>`).join('');
pintarDias();
$('regMes').addEventListener('change', pintarDias);
$('regAnio').addEventListener('input', () => { if ($('regAnio').value.replace(/\D/g, '').length === 4) pintarDias(); });
/** Celular de México como lo hace el backend (celularMX): 52 o 521 al frente se quitan; nunca se recorta. null si no son 10. */
function celular10(s){
  let d = String(s || '').replace(/\D/g, '');
  // Con «+» al frente tiene que ser +52 (o +521) y 10 dígitos completos: un «+52 33 1234 56» recortado no pasa.
  if (/^\s*\+/.test(String(s || '')) && !((d.length === 12 && d.startsWith('52')) || (d.length === 13 && d.startsWith('521')))) return null;
  if (d.length === 12 && d.startsWith('52')) d = d.slice(2);
  else if (d.length === 13 && d.startsWith('521')) d = d.slice(3);
  return /^[1-9]\d{9}$/.test(d) ? d : null;
}
const celBonito = d => `${d.slice(0, 2)} ${d.slice(2, 6)} ${d.slice(6)}`;
$('regCelular').addEventListener('input', () => { const d = celular10($('regCelular').value); $('regCelVes').textContent = d ? Tt('registro.celularVes', { celular: celBonito(d) }) : ''; });
function irRegistro(){
  $('regCorreo').textContent = A.email; $('regError').textContent = ''; $('regOk').disabled = false; pintarDias();
  ir('vRegistro'); setTimeout(() => $('regNombre').focus(), 80);
}
const soloNombre = s => s.trim().replace(/\s+/g, ' ');
let registrando = false;
async function registroOk(){
  if (registrando) return;
  const nombre = soloNombre($('regNombre').value), apellido = soloNombre($('regApellido').value), colonia = soloNombre($('regColonia').value);
  const tel = celular10($('regCelular').value);
  const cumple = { dia: $('regDia').value, mes: $('regMes').value, anio: $('regAnio').value.replace(/\D/g, '') };
  const mal = k => { $('regError').textContent = Tt('registro.errores.' + k); };
  if (nombre.length < 2) return mal('nombre');
  if (apellido.length < 2) return mal('apellido');
  if (!tel) return mal('telefono');
  if (colonia.length < 2) return mal('colonia');
  if ((cumple.dia || cumple.mes || cumple.anio) && !(cumple.dia && cumple.mes)) return mal('cumple');
  registrando = true; $('regOk').disabled = true; $('regError').textContent = '';
  try {
    const j = await api('altaRegistro', { reto: A.reto, correoConfirmado: true, nombre, apellido, telefono: tel, colonia, cumple, ...(A.corrige ? { corrige: A.corrige } : {}) });
    A.verif = j.verif; A.existe = false; A.nombreV = j.nombre || `${nombre} ${apellido}`; A.planes = []; A.reto = null; A.corrige = null;
    sinCorreoEnPila(); irResumen();
  } catch (e) {
    if (e.auth) return;
    const er = errDe(e), r = e.resp || {};
    // El correo apareció en Wix mientras tanto: no se registra como nueva, va por los 4 dígitos.
    if (er === 'existe' && r.sinContacto) { irCel(); celSinSalida(Tt('cel.sinContacto')); return; }
    if (er === 'existe' && r.reto) { A.reto = r.reto; irCel(); if (r.sinTelefono) celSinSalida(Tt('cel.sinTelefono')); return; }
    // Pasó el tiempo del reto: se vuelve a buscar el correo (los datos tecleados se quedan en la pantalla).
    if (er === 'reto' || er === 'usado') { A.reto = null; await buscarCorreo(); return; }
    mal(er === 'colonia' ? 'coloniaRara' : TX.registro.errores[er] ? er : 'red');   // vacía ya la atajó la tablet
  } finally { registrando = false; $('regOk').disabled = false; }
}
$('regOk').onclick = registroOk;

/* --------------------------------------------------------------- 2. el plan, explicado con datos reales */
function svgEl(el, t = 56){ const e = EL[el]; if (!e) return ''; return `<svg class="el" width="${t}" height="${t}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11.5" fill="${e[0]}"/>${e[2]}</svg>`; }
const ppc = p => p.precioPorClase || Infinity;
const desde = xs => Math.min(...xs.map(ppc));
const ul = xs => (xs && xs.length ? `<ul>${xs.map(x => `<li>${x}</li>`).join('')}</ul>` : '');

/** 2a. ¿Membresía o paquete? Qué es cada uno, beneficios (perks reales) y letra chica (términos reales). */
function irTipo(){
  const B = CAT.beneficios || {}, BM = B.membresia || {}, BP = B.paquete || {};
  const ms = CAT.planes.filter(p => p.tipo === 'membresia'), ps = CAT.planes.filter(p => p.tipo === 'paquete');
  $('tipoTitulo').textContent = Tt('tipo.titulo'); $('tipoSub').textContent = Tt('tipo.sub');
  const cartas = [];
  if (ms.length) {
    const d = { desdePorClase: pesos(desde(ms)) };
    let h = `<h2>${T('tipo.membresia.nombre')}</h2><div class="lema">${T('tipo.membresia.lema')}</div>${ul(TX.tipo.membresia.puntos.map((_, i) => T('tipo.membresia.puntos.' + i, d)))}`;
    if ((BM.todas || []).length) h += `<div class="grupo">${T('tipo.membresia.todas')}</div>${ul(BM.todas.map(esc))}`;
    for (const g of BM.grupos || []) if ((g.perks || []).length)
      h += `<div class="grupo">${T('tipo.membresia.solo', { familias: lista((g.familias || []).map(f => Tt('tipo.membresia.familias.' + f) || f)) })}</div>${ul(g.perks.map(esc))}`;
    if (BM.cancelacion) h += `<div class="chica">${T('tipo.membresia.letraChica', { cancelacion: BM.cancelacion })}</div>`;
    cartas.push(`<div class="carta">${h}<button class="btn pri" data-t="membresia">${T('tipo.membresia.boton')}</button></div>`);
  }
  if (ps.length) {
    const d = { desdePorClase: pesos(desde(ps)), vigencias: lista(BP.vigencias || []) };
    const h = `<h2>${T('tipo.paquete.nombre')}</h2><div class="lema">${T('tipo.paquete.lema')}</div>${ul(TX.tipo.paquete.puntos.map((_, i) => T('tipo.paquete.puntos.' + i, d)))}`;
    cartas.push(`<div class="carta">${h}<button class="btn sec" data-t="paquete">${T('tipo.paquete.boton')}</button></div>`);
  }
  $('tipoLista').innerHTML = cartas.join('');
  $('tipoLista').querySelectorAll('button').forEach(b => b.onclick = () => { A.tipo = b.dataset.t; irElemento(); });
  // v4: el botón aparte de trimestrales y semestrales (de todos los elementos: aún no elige) y, si existe, el plan de prueba.
  const pr = CAT.prueba;
  $('tipoExtra').innerHTML = botonLargo(null) + (pr ? `<div class="carta prueba"><div class="grupo">${T('prueba.seccion')}</div><h2>${esc(pr.nombre)}</h2>
    <div>${pr.recurrente ? T('prueba.cobroRecurrente', { precio: pesos(pr.precio), cada: cadaDe(pr.cicloTexto) }) : esc(precioCon(pr))}</div><div class="chica">${T('prueba.aviso')}</div><button class="btn sec" data-prueba="1">${T('prueba.boton')}</button></div>` : '');
  conectarLargo($('tipoExtra'));
  const bp = $('tipoExtra').querySelector('[data-prueba]');
  if (bp) bp.onclick = () => { A.tipo = pr.tipo; A.elemento = null; A.clases = null; elegirPlan(pr); };
  ir('vTipo');
}

/* --------------------------------------------------------------- v4: planes de largo plazo (trimestrales y semestrales) */
/** Botón «Ver planes trimestrales y semestrales». el = null → de todos los elementos. Presume «más baratos que la mensual y
 *  el paquete de las mismas clases» solo si el backend dice que es cierto (CAT.largo.masBarato, por elemento o en total). */
function botonLargo(el){
  const L = CAT.largo || {}, x = el ? (L.elementos || {})[el] : L;
  if (!x || !x.n) return '';
  return `<button class="btn sec" data-largo="${esc(el || '')}">${T(x.masBarato ? 'largo.boton' : 'largo.botonSinPresumir')}</button>`;
}
function conectarLargo(caja){ caja.querySelectorAll('[data-largo]').forEach(b => b.onclick = () => irLargo(b.dataset.largo || null)); }
function irLargo(el){
  const L = CAT.largo || {}, info = el ? (L.elementos || {})[el] : L, presume = !!(info && info.masBarato);
  const xs = CAT.planes.filter(p => p.largo && (!el || p.elemento === el));
  $('largoTitulo').textContent = el ? Tt('largo.tituloEl', { elemento: EL[el][1] }) : Tt('largo.titulo');
  $('largoSub').textContent = Tt(presume ? 'largo.sub' : 'largo.subSinPresumir');
  const cmp = (p, c, k) => (!c ? '' : `<p>${T(c.masBarato ? `largo.${k}` : `largo.${k}No`, { nombre: c.nombre, porClase: pesos(c.porClase),
    porClaseOtro: pesos(c.porClaseOtro), ahorroClase: pesos(c.ahorroClase), ahorroPeriodo: pesos(c.ahorroPeriodo), periodo: p.cicloTexto })}</p>`);
  const carta = p => {
    const canc = (p.letraChica || []).find(l => /cancelaci[oó]n anticipada/i.test(l));
    return `<div class="carta"><h2 style="font-size:22px">${esc(p.nombre)}</h2>
      <div class="lema">${T('largo.cobro', { precio: pesos(p.precio), cada: cadaDe(p.cicloTexto) })}</div>
      <div style="font-size:19px">${T('largo.clases', { clases: p.clases, frecuencia: p.frecuencia })} · <b>${T('largo.porClase', { porClase: pesos(p.precioPorClase) })}</b></div>
      ${cmp(p, p.largo.mensual, 'vsMensual')}${cmp(p, p.largo.paquete, 'vsPaquete')}${notaFaltan([p])}
      ${canc ? `<div class="chica">${T('largo.cancelacion', { cancelacion: canc })}${p.largo.compromiso ? ' ' + T('largo.compromiso', { meses: p.largo.compromiso }) : ''}</div>` : ''}
      <button class="btn pri" data-id="${esc(p.planId)}">${T('largo.elegir')}</button></div>`;
  };
  $('largoLista').innerHTML = ORDEN_EL.filter(e => xs.some(p => p.elemento === e)).map(e =>
    (el ? '' : `<h2 class="largo-el">${svgEl(e, 40)}${EL[e][1]}</h2>`) + `<div class="planes2">${xs.filter(p => p.elemento === e).map(carta).join('')}</div>`).join('');
  $('largoLetra').textContent = Tt('largo.letra');
  $('largoLista').querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
    const p = xs.find(x => x.planId === b.dataset.id); if (!p) return;
    A.tipo = 'membresia'; A.elemento = p.elemento; A.clases = claveClases(p); elegirPlan(p);
  });
  ir('vLargo');
}

/** 2b. Elemento: disciplinas (Bookings) y algunos horarios reales de esta semana. */
function disciplinasDeElemento(el){
  const e = (CAT.elementos || {})[el];
  if (e && e.disciplinas && e.disciplinas.length) return e.disciplinas;
  const p = CAT.planes.find(x => x.elemento === el && x.textoDisciplinas);
  return p ? [p.textoDisciplinas] : [];
}
function irElemento(navegar = true){
  const els = ORDEN_EL.filter(el => CAT.planes.some(p => p.tipo === A.tipo && p.elemento === el));
  $('elTitulo').textContent = Tt('elemento.titulo'); $('elSub').textContent = Tt('elemento.sub');
  $('elLista').innerHTML = els.map(el => {
    const ds = disciplinasDeElemento(el), d = desde(CAT.planes.filter(p => p.tipo === A.tipo && p.elemento === el));
    const horas = HOR ? ds.map(x => (HOR[x] && HOR[x].length ? `<div>${T('elemento.linea', { disciplina: x, horarios: HOR[x].slice(0, 5).join(', ') })}</div>` : '')).join('') : '';
    return `<div class="carta elegible" data-e="${el}" role="button" tabindex="0"><h2>${svgEl(el, 48)}${EL[el][1]}</h2>

/* --------------------------------------------------------------- regreso del sitio (#hash) */
function alRegresar(){
  const h = location.hash || '';
  if (h) history.replaceState(null, '', location.pathname + location.search);   // el recibo no se queda en la barra
  let m;
  if ((m = /^#pagado=([A-Za-z0-9_.-]{20,2000})$/.exec(h))) { irApp(m[1]); return true; }
  if (h === '#fin') { marca.quitar(); fin(Tt('fin.gracias'), Tt('fin.cerrada')); return true; }
  if (h === '#reservada') { marca.quitar(); fin(Tt('fin.reservada'), Tt('fin.reservadaTexto')); return true; }
  if (h === '#cancelado=sesion-abierta') { irBloqueo(); return true; }               // la marca se queda puesta
  if ((m = /^#cancelado=([a-z-]{1,30})$/.exec(h))) {
    marca.quitar();
    const [t, x] = (TX.motivos || {})[m[1]] || TX.motivos.error; fin(t, x); return true;
  }
  return false;
}

/* --------------------------------------------------------------- QR (el mismo del kiosco) */
let qrLib = null;
function cargarQRLib(){
  if (window.QRCode) return Promise.resolve();
  if (qrLib) return qrLib;
  qrLib = new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = QR_SRC; s.integrity = QR_SRI; s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
    const to = setTimeout(() => mal(new Error('timeout')), 5000);
    s.onload = () => { clearTimeout(to); ok(); }; s.onerror = () => { clearTimeout(to); mal(new Error('qr')); };
    document.head.appendChild(s);
  }).catch(e => { qrLib = null; throw e; });
  return qrLib;
}
function qrBonito(texto){
  const tmp = document.createElement('div');
  const q = new QRCode(tmp, { text: texto, width: 64, height: 64, correctLevel: QRCode.CorrectLevel.H });
  const m = q._oQRCode, n = m.getModuleCount(), M = 2, T = n + 2 * M;
  const enOjo = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
  const centro = Math.round(n * 0.24), c0 = Math.floor((n - centro) / 2);
  const enCentro = (r, c) => r >= c0 - 1 && r <= c0 + centro && c >= c0 - 1 && c <= c0 + centro;
  let puntos = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (m.isDark(r, c) && !enOjo(r, c) && !enCentro(r, c)) puntos += `<circle cx="${c + M + .5}" cy="${r + M + .5}" r=".43"/>`;
  const ojo = (r, c) => `<rect x="${c + M + .5}" y="${r + M + .5}" width="6" height="6" rx="1.9" fill="none" stroke="#9A4215" stroke-width="1"/>
    <rect x="${c + M + 2}" y="${r + M + 2}" width="3" height="3" rx="1" fill="#9A4215"/>`;
  const lado = centro + 1, x0 = c0 + M - .5;
  return `<svg viewBox="0 0 ${T} ${T}" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
    <g fill="#424949">${puntos}</g>${ojo(0, 0)}${ojo(0, n - 7)}${ojo(n - 7, 0)}
    <rect x="${x0}" y="${x0}" width="${lado}" height="${lado}" rx="${lado * .28}" fill="#fff"/>
    <image href="${ICONO_HERA}" x="${x0 + lado * .1}" y="${x0 + lado * .1}" width="${lado * .8}" height="${lado * .8}" preserveAspectRatio="xMidYMid meet"/></svg>`;
}

      p.equivalente = { planId: m.planId, nombre: m.nombre, clases: c, frecuencia: 'al mes', precio: m.precio, ...cmp(p, m, 12) };
      m.equivalente = { planId: p.planId, nombre: p.nombre, clases: c, vigenciaTexto: '1 mes', precio: p.precio, ...cmp(p, m, 12) };
      if (t) t.equivalente = { planId: p.planId, nombre: p.nombre, clases: c, vigenciaTexto: '1 mes', precio: p.precio, ...cmp(p, t, 4) };

  // v3: correo que empiece con "ya" = ya tiene cuenta (celular que termina en 1234; pide colonia); "sincel" = cuenta sin
